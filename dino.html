<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>공룡 달리기</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; margin: 12px auto 0; border-radius: 4px; border: 1px solid #ddd; }
  .pad { text-align: center; margin-top: 14px; }
  .pad .btn { width: 44%; font-size: 24px; padding: 22px 0; margin: 4px 2%; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 공룡 달리기</div>
<div class="wrap" style="padding-top:0">
  <canvas id="cv" width="600" height="150"></canvas>
  <div class="pad">
    <button class="btn" id="jump">점프 ▲</button><button class="btn gray" id="duck">숙이기 ▼</button>
  </div>
  <p style="text-align:center;color:#888">화면을 탭하거나 점프 버튼으로 뛰고, 숙이기 버튼을 누르고 있으면 익룡 밑으로 지나가요</p>
</div>
<script src="sound.js?v=16"></script>
<script>
(function () {
  var W = 600, H = 150, GY = 127, U = 2;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var state = 'ready', last = 0, overAt = 0;
  var dy, vy, duck, obs, speed, dist, score, hi = 0, clouds, bumps, runT, night, flashT, lastHund, moonX, started;
  try { hi = parseInt(localStorage.getItem('bestDino') || '0', 10) || 0; } catch (e) {}
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function layout() {
    var w = Math.min(window.innerWidth - 40, 1000);
    if (w < 300) w = 300;
    cv.style.width = w + 'px'; cv.style.height = Math.round(w / 4) + 'px';
  }
  window.addEventListener('resize', layout, false);
  window.addEventListener('orientationchange', layout, false);
  layout();

  // ---- 도트 그림 (직접 그림) ----
  var BODY = [
    '..........##########',
    '..........#.########',
    '..........##########',
    '..........##########',
    '..........#######...',
    '..........#####.....',
    '.........######.....',
    '........#######.....',
    '......###########...',
    '..#...############..',
    '.###..############.##',
    '.####.############..#',
    '######.###########..',
    '#######.##########..',
    '.#######.#########..',
    '..#######.########..',
    '....#######.######..',
    '......#############.'
  ];
  var DUCK = [
    '..................##########',
    '..................#.########',
    '..................##########',
    '..#.........................',
    '.###.....##############..####',
    '.#####..################.###',
    '#######.#################...',
    '.#######################....',
    '..#####################.....',
    '....##################.......'
  ];
  var BIRD1 = [
    '.........##......',
    '........####.....',
    '.......######....',
    '......#######....',
    '.....########.###',
    '#...#########.###',
    '###############..',
    '.#############...',
    '..###########....',
    '....#######......',
    '.....####........'
  ];
  var BIRD2 = [
    '.................',
    '.................',
    '.................',
    '.................',
    '#...#########.###',
    '###############.#',
    '.#############...',
    '..###########....',
    '...######.####...',
    '.....#####..##...',
    '.....###.....#...'
  ];
  function sprite(rows, x, y, color, eyeColor) {
    for (var r = 0; r < rows.length; r++) {
      var line = rows[r], c = 0;
      while (c < line.length) {
        if (line.charAt(c) === '#') {
          var s = c; while (c < line.length && line.charAt(c) === '#') c++;
          ctx.fillStyle = color; ctx.fillRect(Math.round(x + s * U), Math.round(y + r * U), (c - s) * U, U);
        } else c++;
      }
    }
  }

  function reset() {
    dy = 0; vy = 0; duck = false; obs = []; speed = 6; dist = 0; score = 0; runT = 0; night = false; flashT = 0; lastHund = 0; moonX = 0;
    clouds = []; bumps = [];
    for (var i = 0; i < 3; i++) clouds.push({ x: rnd(0, W), y: rnd(15, 60) });
    for (var j = 0; j < 22; j++) bumps.push({ x: rnd(0, W), y: GY + rnd(5, 18), w: rnd(2, 6) });
  }
  function begin() { reset(); state = 'run'; last = 0; }
  function jump() {
    if (state === 'ready') { begin(); }
    else if (state === 'over') { if (Date.now() - overAt > 500) begin(); return; }
    if (state === 'run' && dy === 0 && !duck) { vy = 10.2; SFX.play('jump'); }
  }
  function setDuck(v) {
    if (state === 'ready' || state === 'over') { if (v) jump(); return; }
    duck = v;
  }

  function spawn() {
    var r = Math.random(), o;
    if (score >= 300 && r < 0.28) {
      var tops = [96, 72, 56];
      o = { t: 'b', x: W + 10, w: 34, h: 22, top: tops[Math.floor(Math.random() * 3)] };
    } else {
      var big = Math.random() < 0.45, n = Math.floor(rnd(1, speed > 8 ? 4 : 3));
      var cw = big ? 25 : 17, ch = big ? 50 : 35;
      o = { t: 'c', x: W + 10, big: big, n: n, cw: cw, h: ch, w: n * cw + (n - 1) * 2, top: GY - ch };
    }
    obs.push(o);
    var minGap = Math.round(o.w * speed + 120 * 0.6);
    o.gap = rnd(minGap, minGap * 1.5);
  }

  function hit(o) {
    var dl, dr, dt, db = GY - dy - 3;
    if (duck && dy === 0) { dl = 44; dr = 98; dt = GY - 26 + 3; }
    else { dl = 48; dr = 80; dt = GY - dy - 48 + 3; }
    var ol = o.x + 3, or = o.x + o.w - 3, ot = o.top + 3, ob = o.top + o.h - 3;
    return dl < or && dr > ol && dt < ob && db > ot;
  }

  function update(dt) {
    var f = dt * 0.06; // 60fps 기준 프레임 수
    runT += dt;
    if (speed < 13) speed += 0.001 * f;
    var px = speed * f;
    dist += px; score = dist * 0.025;
    var h = Math.floor(score / 100);
    if (h > lastHund && score > 1) { flashT = 800; SFX.play('point'); }
    lastHund = h;
    if (flashT > 0) flashT -= dt;
    night = (Math.floor(score / 700) % 2) === 1;
    if (dy > 0 || vy > 0) {
      var g = 0.6 * (duck ? 3 : 1);
      dy += vy * f; vy -= g * f;
      if (dy <= 0) { dy = 0; vy = 0; }
    }
    var i;
    for (i = 0; i < obs.length; i++) obs[i].x -= px * (obs[i].t === 'b' ? 1.05 : 1);
    while (obs.length && obs[0].x + obs[0].w < -10) obs.shift();
    var lo = obs[obs.length - 1];
    if (!lo || (W - (lo.x + lo.w)) >= lo.gap) spawn();
    for (i = 0; i < clouds.length; i++) { clouds[i].x -= px * 0.2; if (clouds[i].x < -60) { clouds[i].x = W + rnd(0, 150); clouds[i].y = rnd(15, 60); } }
    for (i = 0; i < bumps.length; i++) { bumps[i].x -= px; if (bumps[i].x < -10) bumps[i].x = W + rnd(0, 50); }
    moonX -= px * 0.05;
    for (i = 0; i < obs.length; i++) if (hit(obs[i])) { die(); break; }
  }
  function die() {
    state = 'over'; overAt = Date.now(); SFX.play('hit');
    var s = Math.floor(score);
    if (s > hi) { hi = s; try { localStorage.setItem('bestDino', hi); } catch (e) {} }
  }

  function pad5(n) { var s = String(Math.floor(n)); while (s.length < 5) s = '0' + s; return s; }
  function rect(x, y, w, h) { ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  function drawCactus(o, fg) {
    ctx.fillStyle = fg;
    for (var k = 0; k < o.n; k++) {
      var x = o.x + k * (o.cw + 2), t = o.top;
      if (!o.big) {
        rect(x + 6, t, 5, o.h); rect(x + 7, t - 2, 3, 2);
        rect(x, t + 10, 4, 12); rect(x, t + 18, 7, 4);
        rect(x + 13, t + 6, 4, 12); rect(x + 10, t + 14, 7, 4);
      } else {
        rect(x + 9, t, 7, o.h); rect(x + 10, t - 2, 5, 2);
        rect(x, t + 14, 5, 18); rect(x, t + 27, 10, 5);
        rect(x + 20, t + 8, 5, 18); rect(x + 15, t + 21, 10, 5);
      }
    }
  }

  function draw() {
    var bg = night ? '#202020' : '#f7f7f7', fg = night ? '#d8d8d8' : '#535353', soft = night ? '#444' : '#dcdcdc';
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    var i;
    if (night) { ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.arc(480 + moonX % 200, 30, 9, 0, 6.2832); ctx.fill(); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(485 + moonX % 200, 28, 8, 0, 6.2832); ctx.fill(); }
    ctx.fillStyle = soft;
    for (i = 0; i < clouds.length; i++) { rect(clouds[i].x, clouds[i].y, 46, 8); rect(clouds[i].x + 8, clouds[i].y - 6, 24, 6); rect(clouds[i].x + 28, clouds[i].y - 3, 12, 4); }
    ctx.fillStyle = fg; ctx.fillRect(0, GY, W, 1);
    ctx.fillStyle = night ? '#666' : '#9a9a9a';
    for (i = 0; i < bumps.length; i++) rect(bumps[i].x, bumps[i].y, bumps[i].w, 1);
    for (i = 0; i < obs.length; i++) {
      var o = obs[i];
      if (o.t === 'c') drawCactus(o, fg);
      else sprite(Math.floor(runT / 140) % 2 ? BIRD1 : BIRD2, o.x, o.top - 4, fg);
    }
    // 공룡
    var x = 40, bottom = GY - dy, eye = state === 'over' ? '#e5484d' : bg, step = Math.floor(runT / 90) % 2;
    if (duck && dy === 0) {
      var t = bottom - 20;
      sprite(DUCK, x, t, fg);
      var a = step ? 1 : 0;
      rect(x + 16, t + 20, 6, a ? 6 : 2); rect(x + 34, t + 20, 6, a ? 2 : 6);
      ctx.fillStyle = eye; rect(x + 38, t + 2, 2, 2);
    } else {
      var t2 = bottom - 48;
      sprite(BODY, x, t2, fg);
      var l = dy > 0 || state !== 'run' ? 6 : (step ? 6 : 3), rr = dy > 0 || state !== 'run' ? 6 : (step ? 3 : 6);
      ctx.fillStyle = fg;
      rect(x + 14, t2 + 36, 8, l * U); rect(x + 24, t2 + 36, 8, rr * U);
      ctx.fillStyle = eye; rect(x + 22, t2 + 2, 2, 2);
    }
    // 점수
    ctx.font = 'bold 16px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = fg;
    var showScore = !(flashT > 0 && Math.floor(flashT / 125) % 2 === 0);
    var txt = (hi > 0 ? 'HI ' + pad5(hi) + '  ' : '') + (showScore ? pad5(score) : '     ');
    ctx.fillText(txt, W - 12, 24);
    ctx.textAlign = 'center';
    if (state === 'ready') ctx.fillText('탭하면 시작', W / 2, 70);
    if (state === 'over') {
      ctx.font = 'bold 22px monospace'; ctx.fillText('G A M E   O V E R', W / 2, 62);
      ctx.strokeStyle = fg; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2, 92, 14, 0.6, 5.7); ctx.stroke();
      ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(W / 2 + 12, 78); ctx.lineTo(W / 2 + 20, 92); ctx.lineTo(W / 2 + 6, 90); ctx.fill();
    }
  }

  function loop(ts) {
    if (state === 'run') {
      if (!last) last = ts;
      var dt = Math.min(40, ts - last); last = ts;
      update(dt);
    }
    draw();
    window.requestAnimationFrame(loop);
  }

  function tp(el, down, up) {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); down(); }, false);
    el.addEventListener('touchend', function (e) { e.preventDefault(); e.stopPropagation(); if (up) up(); }, false);
    el.addEventListener('touchcancel', function () { if (up) up(); }, false);
    el.addEventListener('mousedown', function () { down(); }, false);
    el.addEventListener('mouseup', function () { if (up) up(); }, false);
  }
  tp(document.getElementById('jump'), jump, null);
  tp(document.getElementById('duck'), function () { setDuck(true); }, function () { setDuck(false); });
  tp(cv, jump, null);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
  document.addEventListener('keydown', function (e) {
    if (e.keyCode === 32 || e.keyCode === 38) { e.preventDefault(); jump(); }
    if (e.keyCode === 40) { e.preventDefault(); setDuck(true); }
  }, false);
  document.addEventListener('keyup', function (e) { if (e.keyCode === 40) setDuck(false); }, false);

  reset();
  window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
