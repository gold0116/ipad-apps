<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2048</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  body { -webkit-user-select: none; user-select: none; }
  #info { text-align: center; font-size: 20px; margin: 4px 0 10px; }
  #board { position: relative; width: 320px; height: 320px; margin: 0 auto; background: #bbada0; border-radius: 10px; -ms-touch-action: none; touch-action: none; }
  .c { position: absolute; width: 71px; height: 71px; border-radius: 6px; background: rgba(238,228,218,.35); line-height: 71px; text-align: center; font-weight: bold; font-size: 30px; color: #776e65; }
  .v2{background:#eee4da}.v4{background:#ede0c8}.v8{background:#f2b179;color:#fff}.v16{background:#f59563;color:#fff}
  .v32{background:#f67c5f;color:#fff}.v64{background:#f65e3b;color:#fff}.v128{background:#edcf72;color:#fff;font-size:26px}
  .v256{background:#edcc61;color:#fff;font-size:26px}.v512{background:#edc850;color:#fff;font-size:26px}
  .v1024{background:#edc53f;color:#fff;font-size:20px}.v2048{background:#edc22e;color:#fff;font-size:20px}
  .vbig{background:#3c3a32;color:#fff;font-size:18px}
  #over { text-align: center; color: #e5484d; font-size: 22px; height: 30px; margin-top: 8px; font-weight: bold; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 2048</div>
<div class="wrap">
  <div id="info">점수 <b id="sc">0</b> · 최고 <b id="best">0</b></div>
  <div id="board"></div>
  <div id="over"></div>
  <div style="text-align:center"><button class="btn" id="re">새 게임</button></div>
  <p style="text-align:center;color:#888">화면을 밀어서 타일을 움직이세요 (스와이프)</p>
</div>
<script src="sound.js?v=42"></script>
<script>
(function () {
  var N = 4, g, score = 0, best = 0, over = false;
  var board = document.getElementById('board');
  try { best = parseInt(localStorage.getItem('best2048') || '0', 10) || 0; } catch (e) {}

  function empty() { var r = []; for (var i = 0; i < N; i++) { r.push([0, 0, 0, 0]); } return r; }
  function addTile() {
    var e = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!g[r][c]) e.push([r, c]);
    if (!e.length) return;
    var p = e[Math.floor(Math.random() * e.length)];
    g[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
  }
  function init() { g = empty(); score = 0; over = false; addTile(); addTile(); draw(); SFX.play('start'); SFX.musicStartIfNotOff(true); }

  function slideRow(row) {
    var a = [], moved = false, merged = false, i;
    for (i = 0; i < N; i++) if (row[i]) a.push(row[i]);
    for (i = 0; i < a.length - 1; i++) if (a[i] === a[i + 1]) { a[i] *= 2; score += a[i]; a.splice(i + 1, 1); merged = true; }
    while (a.length < N) a.push(0);
    for (i = 0; i < N; i++) if (a[i] !== row[i]) moved = true;
    return { row: a, moved: moved, merged: merged };
  }
  function move(dir) { // 0 왼쪽, 1 위, 2 오른쪽, 3 아래
    if (over) return;
    var moved = false, merged = false, r, c, line, res;
    for (var k = 0; k < N; k++) {
      line = [];
      for (var j = 0; j < N; j++) {
        if (dir === 0) line.push(g[k][j]);
        else if (dir === 2) line.push(g[k][N - 1 - j]);
        else if (dir === 1) line.push(g[j][k]);
        else line.push(g[N - 1 - j][k]);
      }
      res = slideRow(line);
      if (res.moved) moved = true;
      if (res.merged) merged = true;
      for (j = 0; j < N; j++) {
        if (dir === 0) g[k][j] = res.row[j];
        else if (dir === 2) g[k][N - 1 - j] = res.row[j];
        else if (dir === 1) g[j][k] = res.row[j];
        else g[N - 1 - j][k] = res.row[j];
      }
    }
    if (moved) {
      addTile(); if (!canMove()) over = true; draw();
      SFX.play(merged ? 'coin' : 'move');
      if (over) { SFX.musicStop(true); SFX.play('over'); }
    }
  }
  function canMove() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      if (!g[r][c]) return true;
      if (c < N - 1 && g[r][c] === g[r][c + 1]) return true;
      if (r < N - 1 && g[r][c] === g[r + 1][c]) return true;
    }
    return false;
  }
  function draw() {
    board.innerHTML = '';
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var d = document.createElement('div'), v = g[r][c];
      d.className = 'c' + (v ? ' ' + (v > 2048 ? 'vbig' : 'v' + v) : '');
      d.style.left = (8 + c * 78) + 'px'; d.style.top = (8 + r * 78) + 'px';
      d.textContent = v ? v : '';
      board.appendChild(d);
    }
    if (score > best) { best = score; try { localStorage.setItem('best2048', best); } catch (e) {} }
    document.getElementById('sc').textContent = score;
    document.getElementById('best').textContent = best;
    document.getElementById('over').textContent = over ? '게임 오버!' : '';
  }

  var sx, sy;
  document.addEventListener('touchstart', function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, false);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0); else move(dy > 0 ? 3 : 1);
  }, false);
  document.addEventListener('keydown', function (e) {
    var m = { 37: 0, 38: 1, 39: 2, 40: 3 }[e.keyCode];
    if (m !== undefined) { e.preventDefault(); move(m); }
  }, false);
  document.getElementById('re').onclick = init;
  init();
})();
</script>
<script>SFX.attachBgm('a');</script>
</body>
</html>
