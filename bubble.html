<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>버블 슈터</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #info { text-align: center; font-size: 18px; margin: 4px 0 8px; }
  canvas { display: block; margin: 0 auto; background: #1d2330; border-radius: 8px; touch-action: none; }
  #msg { text-align: center; font-size: 20px; font-weight: bold; color: #e5484d; height: 28px; margin-top: 6px; }
  .pad { text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 버블 슈터</div>
<div class="wrap">
  <div id="info">점수 <b id="sc">0</b> · 단계 <b id="lv">1</b> · 남은 발사 <b id="sh">0</b> · 최고 <b id="best">0</b></div>
  <canvas id="cv" width="320" height="480"></canvas>
  <div id="msg"></div>
  <div class="pad"><button class="btn gray" id="go">새 게임</button></div>
  <p style="text-align:center;color:#888">끌어서 조준하고 손을 떼면 발사 · 같은 색 3개 이상 모으면 터져요<br>자물쇠 구슬은 주변을 터뜨려야 풀리고, 돌 구슬은 색으로 못 맞혀요 · 가끔 폭탄·무지개 구슬이 나와요</p>
</div>
<script src="sound.js?v=39"></script>
<script src="touchfx.js?v=3"></script>
<script>
(function () {
  var W = 320, H = 480, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var tfx = TouchFX.attach(cv);
  function $(i) { return document.getElementById(i); }

  var R = 20, ROWH = R * 1.73, COLS = 8;
  var ORIGIN_Y = R + 6, DANGER_Y = H - 90, SHOOT_X = W / 2, SHOOT_Y = H - 40;
  var COLORS = ['#e5484d', '#2f6fed', '#2a9d4a', '#ffd166', '#6b3fc4', '#5ec9f0'];

  // board[row]는 "짝수 행"이면 길이 COLS, "홀수 행"이면 길이 COLS-1인 배열.
  // 각 칸은 null(빈 칸) 또는 다음 중 하나:
  //   { kind:'normal',  c: 색상 인덱스 }                 보통 구슬
  //   { kind:'locked',  c: 색상 인덱스, hp: 남은 타격 수 }  자물쇠 구슬(주변이 터져야 풀림)
  //   { kind:'obstacle' }                               돌 구슬(색 매칭으로 못 없앰)
  //   { kind:'rainbow' }                                무지개 구슬(어느 색과도 연결됨)
  // 발사/대기 중인 구슬(cur/nxt/flying)은 { kind:'color', c } | { kind:'bomb' } | { kind:'rainbow' }
  var board, score = 0, best = 0, level = 1, state = 'ready', cur = null, nxt = null, overAt = 0, shotsLeft = 0;
  var aim = { x: 0, y: 0, active: false }, flying = null;
  var particles = [], falling = [], flashT = 0, shakeT = 0;
  try { best = parseInt(localStorage.getItem('bestBubble') || '0', 10) || 0; } catch (e) {}

  function rowLen(r) { return (r % 2 === 0) ? COLS : COLS - 1; }
  function rowOffsetX(r) { return (r % 2 === 0) ? R : R * 2; }
  function cellX(r, c) { return rowOffsetX(r) + c * 2 * R; }
  function cellY(r) { return ORIGIN_Y + r * ROWH; }
  function emptyRow(r) { var n = rowLen(r), a = []; for (var i = 0; i < n; i++) a.push(null); return a; }

  // (r,c)의 이웃 최대 6칸: 같은 행 좌우 + 위/아래 행의 2칸(행 종류에 따라 다름)
  function neighbors(r, c) {
    var out = [[r, c - 1], [r, c + 1]];
    if (r % 2 === 0) { out.push([r - 1, c - 1]); out.push([r - 1, c]); out.push([r + 1, c - 1]); out.push([r + 1, c]); }
    else { out.push([r - 1, c]); out.push([r - 1, c + 1]); out.push([r + 1, c]); out.push([r + 1, c + 1]); }
    return out;
  }
  function cellAt(r, c) {
    if (r < 0 || r >= board.length) return undefined;
    if (c < 0 || c >= rowLen(r)) return undefined;
    return board[r][c];
  }

  // ---- 레벨 맵: panthitech/BubbleShooter(공개 저장소)의 실제 레벨 데이터를
  // 가져와 씀(절차적으로 모양만 흉내내던 이전 방식 대신) ----
  // 그 게임은 레벨마다 11칸 고정 폭 격자(mBubble, 홀수 줄은 반 칸 오른쪽으로
  // 밀려 렌더링)에 글자로 내용을 적어 둠: '0'=빈칸, 소문자 r/g/b/y=보통
  // 색 구슬, 대문자 R/G/B/Y=자물쇠 구슬(처음 터뜨리면 그 색 보통 구슬로
  // 풀림), 'o'/'O'=돌 구슬(큰 쪽 'O'는 원래 2번 맞아야 하지만 여기선 단순화
  // 해서 똑같이 1칸짜리 돌 구슬로 취급), '+'=돌/아이템 구슬에 딸린 보조
  // 칸(여기엔 없는 "아이템 모으기" 모드 전용이라 빈 칸으로 둠).
  // 이 게임판은 11칸 고정 폭이 아니라 짝/홀수 줄이 8/7칸으로 번갈아 (폭이
  // 다른) 벌집 격자라서, 각 줄을 원본의 11칸 폭에서 이 게임 폭으로, 또
  // 전체 줄 수를 최대 10줄로 최근접 샘플링해서 맞춤(모양과 색 배치의
  // 전체적인 비율은 그대로 유지, 세부 해상도만 이 게임판 크기에 맞게 줄임).
  // "pop"(색 맞추기) 유형 레벨 중 1~16 안에서 서로 겹치지 않는 8개를 골랐고
  // (2·4·7·12는 10줄이 넘어가 세로로도 리샘플링됨), 그 뒤 레벨은 이 8개를
  // 돌려씀(원작 자체도 17번부터 1~3번을 그대로 반복하는 구조라 같은 방식).
  var IMPORTED_LEVELS = [
    ['0yyyrrrbbb0', '0yybrrybb00', '00ybbryyb00', '00bbbyyy000', '000bbryy000', '000brry0000', '0000rrr0000', '0000rr00000', '00000r00000'],
    ['00rrrrrrr00', '00rrrrrr000', '000yyyyy000', '000yyyy0000', '0000bbb0000', '0000bb00000', '0000yyy0000', '000rrrr0000', '000yyyyy000', '0000rr00000', '00000y00000', '0000bb00000', '0000bbb0000', '0000bb00000', '0000bbb0000', '0000bb00000', '00000r00000', '0000rr00000', '0000rrr0000', '0000rr00000', '00000r00000', '000yyyy0000', '0000yyy0000', '0000yy00000', '00000y00000'],
    ['0bbrrrrrbb0', '0bbrrrrbb00', '00bbrrrbb00', '00bbrrbb000', '000bbrbb000', '0rr0yy0rr00', '00rryyyrr00', '0yy0rr0yy00', '00yyrrryy00', '0r00yy00r00', '00r0yyy0r00', '00rrrrrr000'],
    ['rryyybbb000', 'rryyybbb000', '0rr00000000', '0bb00000000', '00bbyyrrrbb', '00bbyyrrbb0', '00000000bb0', '0000000yy00', 'yybbbrryy00', 'yybbrryy000', '0yy00000000', '0rr00000000', '00rrbbyyyrr', '00rrbbyyrr0', '00000000rr0', '0000000bb00', '0rrryyybb00', 'rrryyybb000'],
    ['0gggbbbggg0', '0gggbbggg00', '0bbbybrbbb0', '0bbyyrrbb00', '0ybggbggbr0', '0yygbbgrr00', '00yybbbrr00', '0rrggggyy00', '00rrygryy00', '00ryyrry000', '000brbyg000', '00brbbyg000', '00brbbbyg00', '0brggggyg00', '00brbbbyg00', '00brbbyg000', '000brbyg000', '000bryg0000', '0000b0g0000'],
    ['rryyy0rrryy', 'rryyyrrryy0', '0rryybrryy0', '0rrybbryy00', '00rrbbbyy00', '0bbgrrgbb00', '0bbggrggbb0', '0bbgyygbb00', '00bryyyrb00', '00rryyrr000', '00bbbgbbb00', '0rbbggbbr00', '0rrbgggbrr0', 'rrrggggrrr0', '000ybbby000', '00yybbyy000', '00yyybyyy00', '0rrrrgggg00', '00rrr0ggg00', '0yry00ygy00', '00yy000yy00', '00y0000y000'],
    ['00RRRRRRR00', '0RyyyyyyR00', '00bbBBBBr00', '0bbrrrrBr00', '0bbBBBBBBr0', 'bbYyyyyrrr0', 'bbYYYYYYbbb', 'yyrrrrrBbb0', '0yyBBBBBBb0', '0yyByyyyy00', '00RRRRRRR00', '0RyyyyyyR00', '00RyyyyyR00', '00RyyyyR000', '000RRyRR000'],
    ['yyybrrrgyyy', 'yybbrrggyy0', '0yoooroooy0', '0bbbbgggg00', '0+O+ooo+O+0', 'yybbrrggyy0', '0yyoyryoyy0', '0boobgoog00', '00bbbrggg00', '0+O+oo+O+00', '0oyyyorrro0', '0oyyoorro00', '00oyo0oro00', '00oo00oo000', '000o000o000']
  ];
  function importedCellFromChar(ch) {
    if (ch === 'r') return { kind: 'normal', c: 0 };
    if (ch === 'b') return { kind: 'normal', c: 1 };
    if (ch === 'g') return { kind: 'normal', c: 2 };
    if (ch === 'y') return { kind: 'normal', c: 3 };
    if (ch === 'R') return { kind: 'locked', c: 0, hp: 1 };
    if (ch === 'B') return { kind: 'locked', c: 1, hp: 1 };
    if (ch === 'G') return { kind: 'locked', c: 2, hp: 1 };
    if (ch === 'Y') return { kind: 'locked', c: 3, hp: 1 };
    if (ch === 'o' || ch === 'O') return { kind: 'obstacle' };
    return null; // '0'(빈 칸), '+'/'x'/'X'(여긴 없는 "아이템 모으기" 전용 칸) — 전부 빈 칸으로
  }
  function boardFromImportedLevel(srcRows) {
    var srcN = srcRows.length, rows = Math.min(srcN, 10);
    var b = [], r, c, len, srcR, srcC;
    for (r = 0; r < rows; r++) {
      b.push([]);
      len = rowLen(r);
      srcR = rows > 1 ? Math.round(r * (srcN - 1) / (rows - 1)) : 0;
      for (c = 0; c < len; c++) {
        srcC = len > 1 ? Math.round(c * 10 / (len - 1)) : 5;
        b[r].push(importedCellFromChar(srcRows[srcR].charAt(srcC)));
      }
    }
    return b;
  }
  function genLevel(n) {
    return boardFromImportedLevel(IMPORTED_LEVELS[(n - 1) % IMPORTED_LEVELS.length]);
  }
  function computeShotsBudget(b) {
    var n = 0, r, c;
    for (r = 0; r < b.length; r++) for (c = 0; c < b[r].length; c++) if (b[r][c]) n++;
    return Math.round(n * 1.6) + 10;
  }

  function colorsPresent() {
    var set = {}, found = false, r, c, cell;
    for (r = 0; r < board.length; r++) for (c = 0; c < rowLen(r); c++) {
      cell = board[r][c];
      if (cell && cell.kind === 'normal') { set[cell.c] = true; found = true; }
    }
    if (!found) return [0];
    var out = [];
    for (var k in set) if (set.hasOwnProperty(k)) out.push(parseInt(k, 10));
    return out;
  }
  function randPresentColor() {
    var p = colorsPresent();
    return p[Math.floor(Math.random() * p.length)];
  }
  // 발사할 구슬을 고른다: 레벨 2부터 가끔 폭탄·무지개가 섞여 나온다
  function randShot() {
    var roll = Math.random();
    if (level >= 2 && roll < 0.05) return { kind: 'bomb' };
    if (level >= 2 && roll < 0.11) return { kind: 'rainbow' };
    return { kind: 'color', c: randPresentColor() };
  }

  function newGame() {
    level = 1; score = 0; state = 'run'; flying = null; particles = []; falling = []; flashT = 0; shakeT = 0;
    board = genLevel(level); shotsLeft = computeShotsBudget(board);
    cur = randShot(); nxt = randShot();
    $('msg').textContent = ''; updateInfo();
    SFX.play('start'); SFX.musicStartIfNotOff(true);
  }
  function nextLevel() {
    level++; board = genLevel(level); shotsLeft = computeShotsBudget(board);
    cur = randShot(); nxt = randShot();
    $('msg').textContent = '단계 ' + level + '!';
    updateInfo();
  }
  function updateInfo() {
    if (score > best) { best = score; try { localStorage.setItem('bestBubble', best); } catch (e) {} }
    $('sc').textContent = score; $('lv').textContent = level; $('sh').textContent = Math.max(0, shotsLeft); $('best').textContent = Math.max(best, score);
  }

  function burst(cx, cy, color, count) {
    for (var i = 0; i < (count || 10); i++) {
      var a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 2.6;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 1.5 + Math.random() * 2, c: color });
    }
  }
  function stepFx() {
    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (i = falling.length - 1; i >= 0; i--) {
      var f = falling[i];
      f.vy += 0.5; f.y += f.vy; f.life -= 0.02;
      if (f.life <= 0 || f.y > H + R) falling.splice(i, 1);
    }
    if (flashT > 0) flashT = Math.max(0, flashT - 0.08);
    if (shakeT > 0) shakeT = Math.max(0, shakeT - 0.1);
  }

  function cellColor(cell) {
    if (!cell) return '#fff';
    if (cell.kind === 'obstacle') return '#5b6472';
    if (cell.kind === 'rainbow') return '#cfd6e6';
    return COLORS[cell.c];
  }
  // col과 "같은 편"인지: 보통 구슬은 색이 같아야 하고, 무지개 구슬은 항상 같은 편으로 침
  function cellMatches(cell, col) {
    if (!cell) return false;
    if (cell.kind === 'normal') return cell.c === col;
    if (cell.kind === 'rainbow') return true;
    return false;
  }
  // (r,c)에서 색 col로 연결된 그룹을 플러드필로 찾는다(자물쇠·돌 구슬은 통과 못 함)
  function sameColorGroup(r, c, col) {
    var seen = {}, st = [[r, c]], out = [];
    seen[r + ',' + c] = true;
    while (st.length) {
      var p = st.pop(), cell = cellAt(p[0], p[1]);
      if (!cellMatches(cell, col)) continue;
      out.push(p);
      var nb = neighbors(p[0], p[1]);
      for (var i = 0; i < nb.length; i++) {
        var key = nb[i][0] + ',' + nb[i][1];
        if (seen[key]) continue;
        seen[key] = true;
        if (cellMatches(cellAt(nb[i][0], nb[i][1]), col)) st.push(nb[i]);
      }
    }
    return out;
  }
  // 천장(0행)에서부터 연결된 모든 칸을 찾아, 거기 포함되지 않은(떠버린) 칸을 반환
  function floatingCells() {
    var seen = {}, st = [], r, c;
    for (c = 0; c < rowLen(0); c++) if (cellAt(0, c)) { st.push([0, c]); seen['0,' + c] = true; }
    while (st.length) {
      var p = st.pop(), nb = neighbors(p[0], p[1]);
      for (var i = 0; i < nb.length; i++) {
        var key = nb[i][0] + ',' + nb[i][1];
        if (seen[key]) continue;
        if (cellAt(nb[i][0], nb[i][1])) { seen[key] = true; st.push(nb[i]); }
      }
    }
    var out = [];
    for (r = 0; r < board.length; r++) for (c = 0; c < rowLen(r); c++) {
      if (cellAt(r, c) && !seen[r + ',' + c]) out.push([r, c]);
    }
    return out;
  }
  function boardEmpty() {
    for (var r = 0; r < board.length; r++) for (var c = 0; c < rowLen(r); c++) if (board[r][c]) return false;
    return true;
  }

  // group 주변에 붙어 있는 자물쇠 구슬 좌표를 중복 없이 모은다
  function gatherLockedDamage(group) {
    var seen = {}, out = [], i, j;
    for (i = 0; i < group.length; i++) {
      var nb = neighbors(group[i][0], group[i][1]);
      for (j = 0; j < nb.length; j++) {
        var cell = cellAt(nb[j][0], nb[j][1]), key = nb[j][0] + ',' + nb[j][1];
        if (cell && cell.kind === 'locked' && !seen[key]) { seen[key] = true; out.push(nb[j]); }
      }
    }
    return out;
  }
  function applyLockedDamage(coords) {
    for (var i = 0; i < coords.length; i++) {
      var p = coords[i], cell = board[p[0]][p[1]];
      if (!cell || cell.kind !== 'locked') continue;
      cell.hp--; SFX.play('tick');
      if (cell.hp <= 0) { board[p[0]][p[1]] = { kind: 'normal', c: cell.c }; SFX.play('unflag'); }
    }
  }
  // coords의 칸들을 실제로 제거(파티클+점수). colorFn(cell)이 파티클 색을 정한다
  function removeCells(coords, perCellScore, colorFn) {
    var total = 0;
    for (var i = 0; i < coords.length; i++) {
      var p = coords[i], cell = board[p[0]][p[1]];
      if (!cell) continue;
      burst(cellX(p[0], p[1]), cellY(p[0]), colorFn(cell));
      board[p[0]][p[1]] = null;
      total++;
    }
    score += total * perCellScore;
    updateInfo();
  }
  function checkFloatingAndDrop() {
    var floats = floatingCells();
    if (!floats.length) return;
    for (var i = 0; i < floats.length; i++) {
      var p = floats[i], cell = board[p[0]][p[1]];
      falling.push({ x: cellX(p[0], p[1]), y: cellY(p[0]), vy: 0, life: 1, cell: cell });
      board[p[0]][p[1]] = null;
    }
    score += floats.length * 20;
    SFX.play('drop');
    updateInfo();
  }
  // 한 발의 결과 처리 공통 마무리: 레벨 클리어 → 위험선 → 발사 소진 순으로 확인, 통과하면 다음 구슬 준비
  function checkWinOrFail() {
    updateInfo();
    if (boardEmpty()) { SFX.play('win'); nextLevel(); return; }
    for (var rr = 0; rr < board.length; rr++) {
      if (cellY(rr) + R >= DANGER_Y) {
        for (var cc = 0; cc < rowLen(rr); cc++) if (board[rr][cc]) { gameOver('stack'); return; }
      }
    }
    if (shotsLeft <= 0) { gameOver('shots'); return; }
    cur = nxt; nxt = randShot();
  }

  function gameOver(reason) {
    state = 'over'; overAt = Date.now(); shakeT = 1; flashT = 1;
    var why = reason === 'shots' ? '발사 횟수 소진' : '구슬이 위험선까지 쌓임';
    $('msg').textContent = '게임 오버(' + why + ')! 점수 ' + score;
    SFX.musicStop(true); SFX.play('over');
  }

  // 날아온 구슬 하나가 (r,c)에 내려앉았을 때의 결과 처리(구슬 종류에 따라 분기)
  function resolveShot(r, c, shot) {
    if (shot.kind === 'bomb') {
      var ring = [[r, c]], n1 = neighbors(r, c), i, j;
      for (i = 0; i < n1.length; i++) ring.push(n1[i]);
      for (i = 0; i < n1.length; i++) { var n2 = neighbors(n1[i][0], n1[i][1]); for (j = 0; j < n2.length; j++) ring.push(n2[j]); }
      var seen = {}, coords = [];
      for (i = 0; i < ring.length; i++) {
        var key = ring[i][0] + ',' + ring[i][1];
        if (seen[key]) continue;
        seen[key] = true;
        if (cellAt(ring[i][0], ring[i][1])) coords.push(ring[i]);
      }
      removeCells(coords, 15, cellColor);
      SFX.play('boom');
      checkFloatingAndDrop();
      checkWinOrFail();
      return;
    }
    if (shot.kind === 'rainbow') {
      var nb = neighbors(r, c), counts = {}, bestCol = null, bestCount = -1, k;
      for (k = 0; k < nb.length; k++) {
        var cc2 = cellAt(nb[k][0], nb[k][1]);
        if (cc2 && cc2.kind === 'normal') counts[cc2.c] = (counts[cc2.c] || 0) + 1;
      }
      for (var key2 in counts) if (counts.hasOwnProperty(key2) && counts[key2] > bestCount) { bestCount = counts[key2]; bestCol = parseInt(key2, 10); }
      if (bestCol !== null) {
        board[r][c] = { kind: 'normal', c: bestCol };
        var group = sameColorGroup(r, c, bestCol);
        if (group.length >= 3) {
          var lockedCoords = gatherLockedDamage(group);
          removeCells(group, 10, function () { return COLORS[bestCol]; });
          applyLockedDamage(lockedCoords);
          SFX.play('tetris');
          checkFloatingAndDrop();
          checkWinOrFail();
          return;
        }
        board[r][c] = { kind: 'rainbow' };
      } else {
        board[r][c] = { kind: 'rainbow' };
      }
      checkWinOrFail();
      return;
    }
    // 보통 색 구슬
    board[r][c] = { kind: 'normal', c: shot.c };
    var grp = sameColorGroup(r, c, shot.c);
    if (grp.length >= 3) {
      var lockedCoords2 = gatherLockedDamage(grp);
      removeCells(grp, 10, function () { return COLORS[shot.c]; });
      applyLockedDamage(lockedCoords2);
      SFX.play('pop');
      checkFloatingAndDrop();
    }
    checkWinOrFail();
  }

  // 날아가는 구슬을 가장 가까운 빈 칸에 내려놓을 위치를 찾는다
  function findSlot(x, y, hitR, hitC) {
    var best = null, bestD = Infinity, cands;
    if (hitR === null) {
      // 천장(어떤 칸과도 안 부딪힘)에 닿은 경우: 0행에서 x에 가장 가까운 빈 칸
      cands = [];
      for (var c = 0; c < rowLen(0); c++) if (!cellAt(0, c)) cands.push([0, c]);
    } else {
      cands = neighbors(hitR, hitC);
      cands.push([hitR, hitC]); // 혹시 그 자리가 비어 있으면(이론상 없어야 하지만 방어적으로)
    }
    for (var i = 0; i < cands.length; i++) {
      var r = cands[i][0], c = cands[i][1];
      if (r < 0 || r >= board.length + 1) continue;
      if (r === board.length) { board.push(emptyRow(r)); }
      if (c < 0 || c >= rowLen(r)) continue;
      if (cellAt(r, c)) continue;
      var dx = cellX(r, c) - x, dy = cellY(r) - y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = [r, c]; }
    }
    return best;
  }

  function fire() {
    if (state !== 'run' || flying) return;
    var dx = aim.x - SHOOT_X, dy = aim.y - SHOOT_Y, len = Math.sqrt(dx * dx + dy * dy);
    if (len < 10) return;
    var speed = 7;
    flying = { x: SHOOT_X, y: SHOOT_Y, vx: dx / len * speed, vy: dy / len * speed, kind: cur.kind, c: cur.c };
    shotsLeft--; updateInfo();
    SFX.play('shoot');
  }

  function updateFlying() {
    if (!flying) return;
    var steps = 3, i;
    for (i = 0; i < steps; i++) {
      flying.x += flying.vx / steps; flying.y += flying.vy / steps;
      if (flying.x < R) { flying.x = R; flying.vx = -flying.vx; SFX.play('tick'); }
      if (flying.x > W - R) { flying.x = W - R; flying.vx = -flying.vx; SFX.play('tick'); }
      var hitR = null, hitC = null, hit = false;
      if (flying.y <= R) { hit = true; }
      else {
        for (var r = 0; r < board.length && !hit; r++) for (var c = 0; c < rowLen(r); c++) {
          var cell = board[r][c];
          if (!cell) continue;
          var ddx = cellX(r, c) - flying.x, ddy = cellY(r) - flying.y;
          if (ddx * ddx + ddy * ddy < (2 * R - 3) * (2 * R - 3)) { hit = true; hitR = r; hitC = c; break; }
        }
      }
      if (hit) {
        var slot = findSlot(flying.x, flying.y, hitR, hitC);
        var shot = flying; flying = null;
        if (slot) resolveShot(slot[0], slot[1], shot);
        return;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shakeT > 0) { var m = shakeT * 4; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    // 보드
    var r, c;
    for (r = 0; r < board.length; r++) for (c = 0; c < rowLen(r); c++) {
      var cell = board[r][c];
      if (!cell) continue;
      drawCell(cellX(r, c), cellY(r), cell);
    }
    // 떨어지는 구슬
    for (var i = 0; i < falling.length; i++) { ctx.globalAlpha = Math.max(0, falling[i].life); drawCell(falling[i].x, falling[i].y, falling[i].cell); }
    ctx.globalAlpha = 1;
    // 위험선
    ctx.strokeStyle = 'rgba(229,72,77,.35)'; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke(); ctx.setLineDash([]);
    // 조준선
    if (state === 'run' && !flying && aim.active) {
      var dx = aim.x - SHOOT_X, dy = aim.y - SHOOT_Y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.setLineDash([5, 6]);
      ctx.beginPath(); ctx.moveTo(SHOOT_X, SHOOT_Y); ctx.lineTo(SHOOT_X + dx / len * 200, SHOOT_Y + dy / len * 200); ctx.stroke();
      ctx.setLineDash([]);
    }
    // 발사 중인 구슬 / 대기 구슬
    if (flying) drawShotVisual(flying.x, flying.y, flying, 1);
    else if (state === 'run' && cur) drawShotVisual(SHOOT_X, SHOOT_Y, cur, 1);
    if (state === 'run' && nxt) { ctx.globalAlpha = 0.6; drawShotVisual(SHOOT_X + 36, SHOOT_Y + 14, nxt, 0.6); ctx.globalAlpha = 1; }
    // 파티클
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flashT * 0.25) + ')'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
    if (state === 'ready') { ctx.fillStyle = '#ccd3e0'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('새 게임을 눌러 시작', W / 2, H / 2); ctx.textAlign = 'left'; }
    tfx.draw(ctx);
  }
  function drawBubble(x, y, color, scale) {
    var rr = R * (scale || 1);
    ctx.beginPath(); ctx.arc(x, y, rr - 1.5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(x - rr * 0.3, y - rr * 0.3, rr * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  }
  function drawRainbow(x, y, scale) {
    var rr = R * (scale || 1), n = COLORS.length, i;
    for (i = 0; i < n; i++) {
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.arc(x, y, rr - 1.5, (i / n) * Math.PI * 2, ((i + 1) / n) * Math.PI * 2);
      ctx.closePath(); ctx.fillStyle = COLORS[i]; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x - rr * 0.3, y - rr * 0.3, rr * 0.3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
  }
  function drawBombIcon(x, y, scale) {
    var rr = R * (scale || 1);
    ctx.beginPath(); ctx.arc(x, y, rr - 1.5, 0, Math.PI * 2); ctx.fillStyle = '#2b2f36'; ctx.fill();
    ctx.beginPath(); ctx.arc(x - rr * 0.3, y - rr * 0.3, rr * 0.3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = Math.max(1.5, rr * 0.12);
    ctx.beginPath(); ctx.moveTo(x, y - rr); ctx.lineTo(x + rr * 0.4, y - rr * 1.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + rr * 0.45, y - rr * 1.5, rr * 0.15, 0, Math.PI * 2); ctx.fillStyle = '#ffd166'; ctx.fill();
  }
  function drawObstacle(x, y) {
    drawBubble(x, y, '#5b6472');
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - R * 0.5, y - R * 0.2); ctx.lineTo(x + R * 0.3, y - R * 0.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - R * 0.2, y + R * 0.3); ctx.lineTo(x + R * 0.5, y + R * 0.1); ctx.stroke();
  }
  function drawLocked(x, y, cell) {
    drawBubble(x, y, COLORS[cell.c]);
    ctx.fillStyle = 'rgba(20,24,32,.45)'; ctx.beginPath(); ctx.arc(x, y, R - 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, R * 0.6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(cell.hp), x, y + 1); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  // 보드/낙하 중인 "이미 놓인" 구슬 그리기(종류별 분기)
  function drawCell(x, y, cell) {
    if (!cell) return;
    if (cell.kind === 'obstacle') { drawObstacle(x, y); return; }
    if (cell.kind === 'rainbow') { drawRainbow(x, y, 1); return; }
    if (cell.kind === 'locked') { drawLocked(x, y, cell); return; }
    drawBubble(x, y, COLORS[cell.c]);
  }
  // 발사 중/대기 중인 구슬(shot 객체) 그리기
  function drawShotVisual(x, y, shot, scale) {
    if (shot.kind === 'bomb') { drawBombIcon(x, y, scale); return; }
    if (shot.kind === 'rainbow') { drawRainbow(x, y, scale); return; }
    drawBubble(x, y, COLORS[shot.c], scale);
  }

  var last = 0;
  function loop() {
    var t = Date.now();
    if (t - last > 8) { updateFlying(); stepFx(); last = t; }
    draw();
    frame();
  }
  function frame() {
    var r = window.requestAnimationFrame || window.webkitRequestAnimationFrame;
    if (r) r.call(window, loop); else setTimeout(loop, 16);
  }

  function setAim(clientX, clientY) {
    var rct = cv.getBoundingClientRect();
    aim.x = (clientX - rct.left) / rct.width * W;
    aim.y = (clientY - rct.top) / rct.height * H;
    aim.active = true;
    if (aim.y > SHOOT_Y - 10) aim.y = SHOOT_Y - 10; // 아래로는 못 쏘게
  }
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); setAim(e.touches[0].clientX, e.touches[0].clientY); }, false);
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); setAim(e.touches[0].clientX, e.touches[0].clientY); }, false);
  cv.addEventListener('touchend', function (e) { e.preventDefault(); fire(); aim.active = false; }, false);
  cv.addEventListener('mousedown', function (e) { setAim(e.clientX, e.clientY); }, false);
  cv.addEventListener('mousemove', function (e) { if (aim.active) setAim(e.clientX, e.clientY); }, false);
  cv.addEventListener('mouseup', function (e) { fire(); aim.active = false; }, false);
  document.addEventListener('touchmove', function (e) { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') e.preventDefault(); }, false);

  $('go').onclick = newGame;
  board = [];
  updateInfo();
  last = Date.now(); frame();
})();
</script>
<script>SFX.attachBgm('a');</script>
</body>
