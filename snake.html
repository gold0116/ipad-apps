<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>스네이크</title>
<link rel="stylesheet" href="style.css">
<style>
  body { -webkit-user-select: none; user-select: none; }
  #info { text-align: center; font-size: 20px; margin: 4px 0 8px; }
  canvas { display: block; margin: 0 auto; background: #1d2330; border-radius: 8px; }
  .pad { text-align: center; margin-top: 10px; }
  .pad .btn { width: 76px; font-size: 26px; padding: 10px 0; }
  #msg { text-align: center; font-size: 22px; font-weight: bold; color: #e5484d; height: 28px; margin-top: 6px; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 스네이크</div>
<div class="wrap">
  <div id="info">점수 <b id="sc">0</b> · 최고 <b id="best">0</b></div>
  <canvas id="cv" width="300" height="300"></canvas>
  <div id="msg"></div>
  <div class="pad">
    <div><button class="btn" id="u">▲</button></div>
    <div><button class="btn" id="l">◀</button><button class="btn gray" id="go">시작</button><button class="btn" id="r">▶</button></div>
    <div><button class="btn" id="d">▼</button></div>
  </div>
  <p style="text-align:center;color:#888">화살표 버튼이나 스와이프로 방향 전환</p>
</div>
<script>
(function () {
  var N = 15, S = 20, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  function layout() {
    var B = Math.min(window.innerWidth - 24, window.innerHeight - 330, 640);
    if (B < 280) B = 280;
    cv.style.width = B + 'px'; cv.style.height = B + 'px';
  }
  window.addEventListener('resize', layout, false);
  window.addEventListener('orientationchange', layout, false);
  layout();
  var snake, dir, nextDir, food, score, best = 0, timer = null, over;
  try { best = parseInt(localStorage.getItem('bestSnake') || '0', 10) || 0; } catch (e) {}
  function $(i) { return document.getElementById(i); }
  function placeFood() {
    while (true) {
      var f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }, ok = true;
      for (var i = 0; i < snake.length; i++) if (snake[i].x === f.x && snake[i].y === f.y) ok = false;
      if (ok) { food = f; return; }
    }
  }
  function start() {
    if (timer) clearInterval(timer);
    snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; over = false;
    $('msg').textContent = ''; placeFood(); draw();
    timer = setInterval(tick, 140);
  }
  function setDir(x, y) { if (x === -dir.x && y === -dir.y) return; nextDir = { x: x, y: y }; }
  function tick() {
    dir = nextDir;
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N) return end();
    for (var i = 0; i < snake.length; i++) if (snake[i].x === h.x && snake[i].y === h.y) return end();
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) { score++; placeFood(); } else snake.pop();
    draw();
  }
  function end() {
    over = true; clearInterval(timer); timer = null;
    if (score > best) { best = score; try { localStorage.setItem('bestSnake', best); } catch (e) {} }
    $('msg').textContent = '게임 오버!'; draw();
  }
  function draw() {
    ctx.fillStyle = '#1d2330'; ctx.fillRect(0, 0, 300, 300);
    ctx.fillStyle = '#e5484d'; ctx.fillRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4);
    for (var i = 0; i < snake.length; i++) {
      ctx.fillStyle = i === 0 ? '#7ee787' : '#3fb950';
      ctx.fillRect(snake[i].x * S + 1, snake[i].y * S + 1, S - 2, S - 2);
    }
    $('sc').textContent = score; $('best').textContent = best;
  }
  $('u').onclick = function () { setDir(0, -1); };
  $('d').onclick = function () { setDir(0, 1); };
  $('l').onclick = function () { setDir(-1, 0); };
  $('r').onclick = function () { setDir(1, 0); };
  $('go').onclick = start;
  var sx, sy;
  document.addEventListener('touchstart', function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, false);
  document.addEventListener('touchmove', function (e) { if (e.target.tagName !== 'INPUT') e.preventDefault(); }, false);
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
  }, false);
  document.addEventListener('keydown', function (e) {
    var m = { 37: [-1, 0], 38: [0, -1], 39: [1, 0], 40: [0, 1] }[e.keyCode];
    if (m) { e.preventDefault(); setDir(m[0], m[1]); }
  }, false);
  snake = [{ x: 7, y: 7 }]; dir = nextDir = { x: 1, y: 0 }; score = 0; placeFood(); draw();
})();
</script>
</body>
</html>
