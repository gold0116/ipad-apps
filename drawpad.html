<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>그림판</title>
<style>
* { -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body { cursor: pointer; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #444; color: #222; font-family: -apple-system, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
a { color: inherit; text-decoration: none; }
#bar { position: absolute; left: 0; top: 0; right: 0; background: #2f6fed; color: #fff; padding: 4px 4px; z-index: 5; }
.b { display: inline-block; vertical-align: middle; height: 44px; line-height: 44px; padding: 0 12px; margin: 2px 3px; border-radius: 10px; background: rgba(255,255,255,.22); color: #fff; font-size: 17px; text-align: center; border: 0; }
.b.on { background: #fff; color: #2f6fed; font-weight: bold; }
.b.off { opacity: .4; }
.b.big { background: #2f6fed; color: #fff; height: 50px; line-height: 50px; padding: 0 22px; font-size: 19px; margin: 6px 4px; }
.b.big.gray { background: #8a8f98; }
#sizebox { display: inline-block; vertical-align: middle; margin: 2px 6px; height: 44px; }
#sizebox canvas { vertical-align: middle; background: #fff; border-radius: 22px; }
#sizebox input { vertical-align: middle; width: 130px; margin: 0 4px; }
#sizebox span { font-size: 15px; }
.slb { display: inline-block; vertical-align: middle; margin: 2px 6px; height: 44px; line-height: 44px; font-size: 15px; }
.slb input { vertical-align: middle; width: 110px; margin: 0 4px; }
#sv { position: absolute; right: 8px; top: 6px; font-size: 13px; color: #fff; background: rgba(0,0,0,.45); padding: 2px 10px; border-radius: 10px; z-index: 3; }
#side { position: absolute; left: 0; width: 84px; background: #e9ebef; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 4; padding: 4px 0; }
.tool { width: 74px; margin: 3px auto; padding: 3px 0 2px; background: #fff; border-radius: 10px; text-align: center; font-size: 13px; border: 3px solid transparent; }
.tool.sel { border-color: #2f6fed; background: #e6eeff; }
.tool canvas { display: block; margin: 0 auto; }
#pal { position: absolute; left: 0; right: 0; bottom: 0; background: #e9ebef; padding: 4px 6px; z-index: 4; }
.sw { display: inline-block; vertical-align: middle; width: 38px; height: 38px; margin: 2px 3px; border-radius: 19px; border: 3px solid #fff; -webkit-box-shadow: 0 0 0 1px #888; box-shadow: 0 0 0 1px #888; }
.sw.sel { border-color: #2f6fed; -webkit-box-shadow: 0 0 0 2px #2f6fed; box-shadow: 0 0 0 2px #2f6fed; }
.sw.mk { background: #fff; text-align: center; line-height: 32px; font-size: 22px; color: #2f6fed; font-weight: bold; }
#stage { position: absolute; overflow: hidden; background: #7d838c; }
#view { display: block; position: absolute; left: 0; top: 0; }
#hud { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; padding: 6px 12px; border-radius: 14px; font-size: 15px; display: none; z-index: 3; }
#rbar { display: none; position: absolute; left: 0; right: 0; bottom: 0; background: #1f2937; color: #fff; padding: 6px 8px; z-index: 6; }
#rbar .b { background: #3b4658; }
#rbar .b.on { background: #fff; color: #1f2937; }
#rbar input[type=range] { width: 60%; vertical-align: middle; margin: 8px 6px; }
body.rp #bar, body.rp #side, body.rp #pal { display: none; }
body.rp #rbar { display: block; }
.ov { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); display: none; z-index: 30; }
.card { background: #fff; margin: 24px auto; max-width: 660px; width: 94%; border-radius: 16px; padding: 16px; max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.card h2 { margin: 0 0 8px; font-size: 22px; }
.card p { margin: 6px 0; font-size: 15px; color: #555; }
#outimg { max-width: 100%; display: block; margin: 8px auto; border: 1px solid #ccc; }
#err { position: fixed; left: 0; right: 0; bottom: 0; background: #c00; color: #fff; padding: 6px 10px; font-size: 13px; display: none; z-index: 99; }
</style>
</head>
<body>
<div id="bar">
  <a class="b" id="bHome" data-act="home">‹ 작품</a><span class="b off" id="bUndo" data-act="undo">취소</span><span class="b off" id="bRedo" data-act="redo">다시</span><span class="b" data-act="clear">전체 지움</span><span id="sizebox"><canvas id="szc" width="44" height="44"></canvas><input type="range" id="sz" min="1" max="80" value="6"><span id="szl">6</span></span><span class="slb">투명도<input type="range" id="al" min="5" max="100" value="100"><span id="all">100%</span></span><span id="fillopt" style="display:none"><span style="font-size:15px;margin-left:4px">채우기 감도</span><span class="b" data-act="fs" data-v="0">낮음</span><span class="b on" data-act="fs" data-v="1">보통</span><span class="b" data-act="fs" data-v="2">높음</span></span><span class="b" id="bHand" data-act="hand">손 이동</span><span class="b" data-act="fit">전체 보기</span><span class="b" data-act="upright">똑바로</span><span class="b" data-act="z100">100%</span><span class="b" id="zl" style="background:none;padding:0 4px">100%</span><span class="b" data-act="replay">다시보기 ▶</span><span class="b" data-act="img">이미지</span><span class="b" data-act="send">PC로 보내기</span>
</div>
<div id="side" class="scrl"></div>
<div id="stage"><canvas id="view" width="10" height="10"></canvas><div id="hud"></div><div id="sv"></div></div>

  </div>
  <div><input type="range" id="rSeek" min="0" max="1000" value="0"><span id="rTime" style="font-size:15px">0:00</span><span id="rPen" style="font-size:15px;margin-left:10px"></span></div>
</div>

<div class="ov" id="colov"><div class="card">
  <h2>내 색 만들기</h2>
  <p>아래 큰 네모에서 색을 고르고, 가는 띠에서 색깔 종류를 고르세요.</p>
  <canvas id="svc" width="300" height="190" style="display:block;margin:6px auto;border-radius:8px"></canvas>
  <canvas id="huec" width="300" height="30" style="display:block;margin:6px auto;border-radius:8px"></canvas>
  <div style="text-align:center"><span class="sw" id="colPrev" style="width:60px;height:40px;border-radius:8px"></span></div>
  <div style="text-align:right"><span class="b big gray" data-act="colcancel">취소</span><span class="b big" data-act="colok">이 색 쓰기</span></div>
</div></div>

<div class="ov" id="imgov"><div class="card scrl">
  <h2>이미지로 저장</h2>
  <p id="imgmsg">아래 그림을 <b>손가락으로 길게 누르면</b> "이미지 저장"(또는 "사진에 추가") 메뉴가 나와요.</p>
  <img id="outimg" alt="">
  <div style="text-align:right"><span class="b big" data-act="imgclose">닫기</span></div>
</div></div>

<script>
window.onerror = function (m, u, l) { var d = document.getElementById('err'); if (d) { d.style.display = 'block'; d.textContent = '오류: ' + m + ' (줄 ' + l + ')'; } };
(function () {
  function $(i) { return document.getElementById(i); }
  var RAF = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(f, 16); };

  /* ---------- 펜 ---------- */
  var PENS = {
    pen:     { name: '사인펜', wf: 1,   alpha: 1,   kind: 'line' },
    pencil:  { name: '연필',   wf: 0.6, alpha: 0.7, kind: 'line' },
    marker:  { name: '마커',   wf: 2.2, alpha: 0.85, kind: 'line' },
    brush:   { name: '붓',     wf: 1,   alpha: 1,   kind: 'brush' },
    crayon:  { name: '크레용', wf: 1.8, alpha: 0.5, kind: 'crayon' },
    hl:      { name: '형광펜', wf: 3.5, alpha: 1,   kind: 'hl' },
    eraser:  { name: '지우개', wf: 2,   alpha: 1,   kind: 'erase' }
  };
  var PEN_ORDER = ['pen', 'pencil', 'marker', 'brush', 'crayon', 'hl', 'eraser'];
  var PALETTE = ['#000000', '#555555', '#999999', '#d9d9d9', '#ffffff', '#7a4a21', '#e5484d', '#ff7a1a', '#ffc400', '#fff200', '#8bc34a', '#2a9d4b',
                 '#0b6b3a', '#00bcd4', '#a1d6ff', '#2f6fed', '#1a3fa8', '#7e57c2', '#d6409f', '#ff9bb5', '#ffd9a8', '#f5cba7', '#c68642', '#8d5524'];
  var HLOK = (function () { try { var c = document.createElement('canvas').getContext('2d'); c.globalCompositeOperation = 'darken'; return c.globalCompositeOperation === 'darken'; } catch (e) { return false; } })();

  function hexRgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function isDark(h) { var c = hexRgb(h); return (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) < 110; }
  function toHex(r, g, b) { function f(n) { n = Math.max(0, Math.min(255, Math.round(n))); return (n < 16 ? '0' : '') + n.toString(16); } return '#' + f(r) + f(g) + f(b); }
  function rng(seed) { var s = Math.abs(Math.floor(seed)) % 233280; return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  function r1(v) { return Math.round(v * 10) / 10; }

  /* ---------- 획 그리기 (실시간·다시보기·되돌리기 모두 같은 코드) ---------- */
  function Stroker(op, paper) { this.op = op; this.paper = paper; this.j = 0; this.pw = 0; }
  // 이번 호출에서 "새로 그려진 부분"의 바운딩 박스만 돌려준다(그 전까지
  // 그려둔 부분은 다시 안 훑음) — 화면 갱신 영역(markDoc) 계산용. 전체
  // 점을 매번 처음부터 다시 훑으면 선이 길어질수록(한 번의 touchmove마다
  // 지금까지의 점 전부를 다시 보므로) 계산량이 제곱으로 늘어나서, 길게
  // 그은 선 하나만으로도 버벅이다 못 버티는 문제가 있었음(실기에서
  // "긴 선 하나가 꽤 버텼다"는 피드백으로 확인).
  Stroker.prototype.upTo = function (ctx, k, fin) {
    var op = this.op, q = op.q, pen = PENS[op.p], j = this.j;
    var w = Math.max(0.6, op.w * pen.wf);
    var col = pen.kind === 'erase' ? this.paper : op.c;
    var bb = [1e9, 1e9, -1e9, -1e9];
    function ext(x, y, r) { if (x - r < bb[0]) bb[0] = x - r; if (y - r < bb[1]) bb[1] = y - r; if (x + r > bb[2]) bb[2] = x + r; if (y + r > bb[3]) bb[3] = y + r; }
    var oa = op.a || 1;
    var alpha = pen.alpha, comp = 'source-over';
    if (pen.kind === 'hl') { if (HLOK) { alpha = 1; comp = isDark(this.paper) ? 'lighten' : 'darken'; } else { alpha = 0.35; } }
    alpha *= oa;
    ctx.lineCap = alpha < 1 ? 'butt' : 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.globalAlpha = alpha; ctx.globalCompositeOperation = comp;
    var clipOn = alpha < 1 || comp !== 'source-over';
    if (fin && k === 1 && j === 0) {
      var rr = (pen.kind === 'brush' ? op.w * 1.1 : w) / 2;
      if (clipOn) { ctx.save(); ctx.beginPath(); ctx.rect(Math.floor(q[0] - rr - 3), Math.floor(q[1] - rr - 3), Math.ceil(rr * 2 + 6), Math.ceil(rr * 2 + 6)); ctx.clip(); }
      ctx.beginPath(); ctx.arc(q[0], q[1], rr, 0, 6.2832); ctx.fill();
      if (clipOn) ctx.restore();
      ext(q[0], q[1], rr + 2); this.j = 1;
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      return bb;
    }
    var last = fin ? k : k - 1;
    for (; j < last; j++) {
      var sx, sy, cx, cy, ex, ey, nx, ny;
      if (j === k - 1) { sx = (q[2 * j - 2] + q[2 * j]) / 2; sy = (q[2 * j - 1] + q[2 * j + 1]) / 2; cx = ex = q[2 * j]; cy = ey = q[2 * j + 1]; }
      else {
        cx = q[2 * j]; cy = q[2 * j + 1];
        nx = q[2 * j + 2]; ny = q[2 * j + 3];
        ex = (cx + nx) / 2; ey = (cy + ny) / 2;
        if (j === 0) { sx = cx; sy = cy; } else { sx = (q[2 * j - 2] + cx) / 2; sy = (q[2 * j - 1] + cy) / 2; }
      }
      var lw = w;
      if (pen.kind === 'brush') {
        var dd;
        if (j < k - 1) { dd = Math.sqrt((q[2 * j + 2] - q[2 * j]) * (q[2 * j + 2] - q[2 * j]) + (q[2 * j + 3] - q[2 * j + 1]) * (q[2 * j + 3] - q[2 * j + 1])); this.pd = dd; } else { dd = this.pd || 0; }
        var s = Math.min(1, dd / (op.w * 1.5 + 8));
        var tw = op.w * 1.3 * (1.2 - 0.85 * s);
        this.pw = this.pw ? this.pw * 0.6 + tw * 0.4 : tw;
        lw = Math.max(0.6, this.pw);
      }
      // 투명하게 그릴 때는 그 조각 둘레만 잘라서 그린다(아이패드가 그림 전체 크기의 임시 메모리를 쓰는 것을 막음)
      if (clipOn) {
        var mg = lw / 2 + 3; if (pen.kind === 'crayon') mg = Math.max(mg, w + 4);
        var kx0 = Math.floor(Math.min(sx, cx, ex) - mg), ky0 = Math.floor(Math.min(sy, cy, ey) - mg);
        var kx1 = Math.ceil(Math.max(sx, cx, ex) + mg), ky1 = Math.ceil(Math.max(sy, cy, ey) + mg);
        ctx.save(); ctx.beginPath(); ctx.rect(kx0, ky0, kx1 - kx0, ky1 - ky0); ctx.clip();
      }
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
      ext(sx, sy, lw / 2 + 3); ext(cx, cy, lw / 2 + 3); ext(ex, ey, lw / 2 + 3);
      if (pen.kind === 'crayon') {
        var rnd = rng(op.s + j * 977);
        var len = Math.sqrt((ex - sx) * (ex - sx) + (ey - sy) * (ey - sy));
        var cnt = Math.min(70, Math.ceil(len * w / 14) + 1);
        var ux = len > 0.01 ? (ex - sx) / len : 1, uy = len > 0.01 ? (ey - sy) / len : 0;
        ctx.globalAlpha = 0.85 * oa;
        for (var m = 0; m < cnt; m++) {
          var t = rnd(), off = (rnd() - 0.5) * w * 1.5, sz = 0.8 + rnd() * 1.6;
          var px = sx + (ex - sx) * t - uy * off, py = sy + (ey - sy) * t + ux * off;
          ctx.fillRect(px, py, sz, sz);
        }
        ctx.globalAlpha = alpha;
        ext(sx, sy, w * 1.2); ext(ex, ey, w * 1.2);
      }
      if (clipOn) ctx.restore();
    }
    this.j = j;
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    return bb[0] > bb[2] ? null : bb;
  };

  /* ---------- 채우기 ---------- */
  function floodFill(ctx, W, H, sx, sy, hex, fa, TOL, DIL) {
    if (TOL === undefined) TOL = 70;
    if (DIL === undefined) DIL = 230;
    if (fa === undefined) fa = 1;
    sx = Math.floor(sx); sy = Math.floor(sy);
    if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
    var img = ctx.getImageData(0, 0, W, H), d = img.data;
    var si = (sy * W + sx) * 4, sr = d[si], sg = d[si + 1], sb = d[si + 2];
    var c = hexRgb(hex);
    if (fa >= 1 && Math.abs(c[0] - sr) + Math.abs(c[1] - sg) + Math.abs(c[2] - sb) < 6) return;
    var mask = new Uint8Array(W * H);
    var stack = [sx, sy], x, y, x1, up, dn, m, i, a, b2, c2;
    function ok(px, py) {
      var mm = py * W + px; if (mask[mm]) return false;
      var ii = mm * 4;
      a = d[ii] - sr; if (a > TOL || a < -TOL) return false;
      b2 = d[ii + 1] - sg; if (b2 > TOL || b2 < -TOL) return false;
      c2 = d[ii + 2] - sb; if (c2 > TOL || c2 < -TOL) return false;
      return true;
    }
    while (stack.length) {
      y = stack.pop(); x = stack.pop();
      x1 = x; while (x1 >= 0 && ok(x1, y)) x1--; x1++;
      up = false; dn = false;
      while (x1 < W && ok(x1, y)) {
        mask[y * W + x1] = 1;
        if (y > 0) { var o1 = ok(x1, y - 1); if (!up && o1) { stack.push(x1, y - 1); up = true; } else if (up && !o1) up = false; }
        if (y < H - 1) { var o2 = ok(x1, y + 1); if (!dn && o2) { stack.push(x1, y + 1); dn = true; } else if (dn && !o2) dn = false; }
        x1++;
      }
    }
    // 가장자리 한 칸 넓히기(선 둘레의 흐린 테두리 덮기)
    for (y = 0; DIL > 0 && y < H; y++) {
      for (x = 0; x < W; x++) {
        m = y * W + x;
        if (mask[m]) continue;
        if ((x > 0 && mask[m - 1] === 1) || (x < W - 1 && mask[m + 1] === 1) || (y > 0 && mask[m - W] === 1) || (y < H - 1 && mask[m + W] === 1)) {
          i = m * 4;
          var mx = Math.max(Math.abs(d[i] - sr), Math.abs(d[i + 1] - sg), Math.abs(d[i + 2] - sb));
          if (mx < DIL) mask[m] = 2;
        }
      }
    }
    for (m = 0; m < W * H; m++) {
      if (mask[m]) {
        i = m * 4;
        if (fa >= 1) { d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; }
        else { d[i] = d[i] * (1 - fa) + c[0] * fa; d[i + 1] = d[i + 1] * (1 - fa) + c[1] * fa; d[i + 2] = d[i + 2] * (1 - fa) + c[2] * fa; }
        d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function applyOp(ctx, op, paper, W, H) {
    if (op.k === 's') { var st = new Stroker(op, paper); st.upTo(ctx, op.q.length / 2, true); }
    else if (op.k === 'f') { floodFill(ctx, W, H, op.x, op.y, op.c, op.a, op.tl, op.dl); }
    else if (op.k === 'c') { ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H); }
  }

  /* ---------- 상태 ---------- */
  var doc = null, docCv = null, dctx = null, W = 0, H = 0;
  // 되돌리기(undo)는 "바뀐 부분만 조각으로 보관"하던 방식(용량 예산이 있어도,
  // 캔버스를 길게 가로지르는 획은 바운딩 박스가 거의 캔버스 전체만큼 커져서
  // 조각 하나가 그대로 커지는 문제가 있었음 — 아이패드2에서 곡선 18개만
  // 그려도 메모리 부족으로 리프레시되는 걸로 확인됨)을 걷어내고, 되돌릴 때
  // 마다 그냥 기록(ops)을 처음부터 다시 그리는(rebuildAll) 쪽으로 단순화함.
  // 조각을 아예 안 만들어서 메모리 사용량이 "지금 그려진 캔버스 하나"로
  // 고정되고(획이 몇 개든 늘지 않음), 그 대신 되돌릴 때마다 지금까지 그린
  // 걸 다시 그리는 약간의 시간이 듦(짧게 디바운스해서 연달아 눌러도 한 번만).

  function buildPalette() {
    var h = '', i, all = PALETTE.concat(customColors);
    for (i = 0; i < all.length; i++) h += '<span class="sw" data-c="' + all[i] + '" style="background:' + all[i] + '"></span>';
    h += '<span class="sw mk" data-act="coldlg">+</span>';
    $('pal').innerHTML = h;
    refreshTools();
  }

  /* ---------- 내 색 만들기 ---------- */
  var hsv = { h: 0.6, s: 0.8, v: 0.9 };
  function hsv2hex(h, s, v) {
    var i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s), r, g, b;
    switch (i % 6) { case 0: r = v; g = t; b = p; break; case 1: r = q; g = v; b = p; break; case 2: r = p; g = v; b = t; break; case 3: r = p; g = q; b = v; break; case 4: r = t; g = p; b = v; break; default: r = v; g = p; b = q; }
    return toHex(r * 255, g * 255, b * 255);
  }
  function paintColDlg() {
    var c = $('svc'), x = c.getContext('2d'), w = c.width, h = c.height;
    x.fillStyle = hsv2hex(hsv.h, 1, 1); x.fillRect(0, 0, w, h);
    var g = x.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#ffffff'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000000'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    var px = hsv.s * w, py = (1 - hsv.v) * h;
    x.lineWidth = 3; x.strokeStyle = '#fff'; x.beginPath(); x.arc(px, py, 10, 0, 6.2832); x.stroke();
    x.lineWidth = 1; x.strokeStyle = '#000'; x.beginPath(); x.arc(px, py, 11.5, 0, 6.2832); x.stroke();
    var hc = $('huec'), y = hc.getContext('2d'), hw = hc.width, hh = hc.height;
    g = y.createLinearGradient(0, 0, hw, 0);
    for (var i = 0; i <= 6; i++) g.addColorStop(i / 6, hsv2hex(i / 6 === 1 ? 0.9999 : i / 6, 1, 1));
    y.fillStyle = g; y.fillRect(0, 0, hw, hh);
    var hx = hsv.h * hw; y.lineWidth = 3; y.strokeStyle = '#fff'; y.strokeRect(hx - 5, 1, 10, hh - 2); y.lineWidth = 1; y.strokeStyle = '#000'; y.strokeRect(hx - 6.5, 0, 13, hh);
    $('colPrev').style.background = hsv2hex(hsv.h, hsv.s, hsv.v);
  }
  function bindDrag(el, fn) {
    function pos(cx, cy) { var r = el.getBoundingClientRect(); fn(Math.max(0, Math.min(1, (cx - r.left) / r.width)), Math.max(0, Math.min(1, (cy - r.top) / r.height))); }
    var down = false;
    el.addEventListener('touchstart', function (e) { e.preventDefault(); pos(e.touches[0].clientX, e.touches[0].clientY); }, false);
    el.addEventListener('touchmove', function (e) { e.preventDefault(); pos(e.touches[0].clientX, e.touches[0].clientY); }, false);
    el.addEventListener('mousedown', function (e) { down = true; pos(e.clientX, e.clientY); }, false);
    window.addEventListener('mousemove', function (e) { if (down) pos(e.clientX, e.clientY); }, false);
    window.addEventListener('mouseup', function () { down = false; }, false);
  }
  bindDrag($('svc'), function (fx, fy) { hsv.s = fx; hsv.v = 1 - fy; paintColDlg(); });
  bindDrag($('huec'), function (fx) { hsv.h = Math.min(0.9999, fx); paintColDlg(); });

  /* ---------- 문서 불러오기·새로 만들기 ---------- */
  function setupDoc(d) {
    if (docCv) { docCv.width = docCv.height = 0; }
    clearTimeout(rebuildT); rebuildT = 0;
    doc = d; W = d.W; H = d.H;
    docCv = document.createElement('canvas'); docCv.width = W; docCv.height = H; dctx = docCv.getContext('2d');
    ops = []; redo = []; mode = 'none'; pend = null; st = null; curOp = null;
    layout();
    var z = fitZ(); view.z = z; view.a = 0; view.ox = (vw - W * z) / 2; view.oy = (vh - H * z) / 2;
  }
  function newDocFromParams(W_, H_, paper) {
    var d = { v: 1, id: 'd' + (+new Date()), W: W_, H: H_, paper: paper, ops: [], views: [], T: 0, created: +new Date() };
    TT = 0; lastReal = 0;
    setupDoc(d); fillPaper();
    tool.color = isDark(paper) ? '#ffffff' : '#000000';
    recView(true); dirtySave = true; saveNow();
    buildTools(); buildPalette(); updBtns(); markFull(); updZoomUI();
    hud('한 손가락: 그리기 / 두 손가락: 확대·이동·회전', 3500);
  }
  function openDoc(id) {
    var s = null;
    try { s = localStorage.getItem('_draw_' + id); } catch (e) {}
    if (!s) { alert('그림을 찾을 수 없어요.'); location.href = 'draw.html'; return; }
    var d; try { d = JSON.parse(s); } catch (e) { alert('그림 파일이 깨졌어요.'); location.href = 'draw.html'; return; }
    hud('불러오는 중…');
    setTimeout(function () {
      TT = d.T || 0; lastReal = 0;
      var list = d.ops || []; d.ops = [];
      if (!d.views) d.views = [];
      setupDoc(d); fillPaper();
      for (var i = 0; i < list.length; i++) { applyOp(dctx, list[i], doc.paper, W, H); finalizeOp(list[i]); }
      doc.ops = ops;
      tool.color = isDark(doc.paper) ? '#ffffff' : '#000000';
      recView(true);
      buildTools(); buildPalette(); updBtns(); markFull(); updZoomUI(); $('sv').textContent = '저장됨'; hud('');
    }, 40);
  }

  /* ---------- 이미지 내보내기 ---------- */
  function makeImg() {
    flushRebuild();
    var c = docCv, tmp = null, w = W, h = H, u = '', ext = 'png';
    if (W * H > 6000000) { var f = Math.sqrt(3000000 / (W * H)); w = Math.round(W * f); h = Math.round(H * f); tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h; tmp.getContext('2d').drawImage(docCv, 0, 0, w, h); c = tmp; }
    try { if (w * h > 2000000) { u = c.toDataURL('image/jpeg', 0.92); ext = 'jpg'; } else u = c.toDataURL('image/png'); } catch (e) { u = ''; }
    if (tmp) tmp.width = tmp.height = 0;
    return u ? { url: u, ext: ext } : null;
  }
  function exportImg() {
    var r = makeImg();
    if (!r) { alert('이미지를 만들지 못했어요(그림이 너무 커요).'); return; }
    $('outimg').src = r.url; $('imgov').style.display = 'block';
  }

  /* ---------- PC(노트북 서버)로 보내기 ---------- */
  function xhr(method, url, body, done) {
    var x = new XMLHttpRequest();
    x.open(method, url, true); x.timeout = 60000;
    x.onload = function () { done(x.status, x.responseText); };
    x.onerror = function () { done(0, ''); }; x.ontimeout = function () { done(0, ''); };
    try { x.send(body || null); } catch (e) { done(0, ''); }
  }
  function pcOk() {
    if (location.protocol !== 'http:') { alert('이 주소로는 PC에 보낼 수 없어요.\n노트북 서버 주소(http://…:8081/draw.html)로 그림판을 열어서 사용하세요.'); return false; }
    return true;
  }
  function sendToPC() {
    if (!doc || !pcOk()) return;
    flushRebuild(); dirtySave = true; saveNow();
    doc.ops = ops; doc.T = TT;
    var im = makeImg();
    if (!im) { alert('이미지를 만들지 못했어요.'); return; }
    var meta = JSON.stringify({ id: doc.id, w: W, h: H, upd: +new Date(), n: ops.length, ext: im.ext, thumb: thumbOf() });
    hud('PC로 보내는 중…');
    xhr('POST', '/api/drawsave', meta + '\n' + JSON.stringify(doc) + '\n' + im.url, function (st, txt) {
      if (st === 200) hud('PC로 보냈어요 (C:\\ws\\midi\\drawings)', 4000);
      else { hud(''); alert(st === 0 ? 'PC에 연결하지 못했어요. 노트북 서버가 켜져 있는지, 같은 와이파이인지 확인하세요.' : '보내지 못했어요: ' + txt); }
    });
  }

  /* ---------- 다시보기 ---------- */
  function startReplay() {
    flushRebuild();
    if (!doc.ops.length) { hud('아직 그린 게 없어요.', 2000); return; }
    saveNow();
    var items = [], i, o, v;
    for (i = 0; i < ops.length; i++) { o = ops[i]; items.push({ ty: 'o', op: o, t0: o.t || 0, t1: (o.t || 0) + (o.d || 0), ix: items.length }); }
    for (i = 0; i < doc.views.length; i++) { v = doc.views[i]; items.push({ ty: 'v', v: v, t0: v[0], t1: v[0], ix: items.length }); }
    items.sort(function (a, b) { return (a.t0 - b.t0) || (a.ix - b.ix); });
    var shift = items.length ? items[0].t0 - 200 : 0, prevEnd = items.length ? items[0].t0 : 0, total = 0, views = [];
    for (i = 0; i < items.length; i++) {
      var it = items[i], gap = it.t0 - prevEnd;
      if (gap > 900) shift += gap - 300;
      it.rt0 = it.t0 - shift; it.rt1 = it.t1 - shift;
      if (it.t1 > prevEnd) prevEnd = it.t1;
      if (it.rt1 > total) total = it.rt1;
      if (it.ty === 'v') views.push({ rt: it.rt0, cx: it.v[1], cy: it.v[2], z: it.v[3], a: it.v[4] || 0 });
    }
    total += 700;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    R = { cv: cv, ctx: cv.getContext('2d'), items: items, views: views, total: total, i: 0, cur: null, st: null, pt: 0, play: true, speed: 1, follow: true, last: 0, drag: false, view: { z: 1, ox: 0, oy: 0, a: 0 }, loop: 0 };
    R.ctx.fillStyle = doc.paper; R.ctx.fillRect(0, 0, W, H);
    inReplay = true; document.body.className = 'rp';
    setRBtns(); layout();
    R.last = +new Date(); rloop();
  }
  function setRBtns() {
    $('rPlay').textContent = R.play ? '멈춤' : (R.pt >= R.total ? '처음부터' : '재생');
    var s = document.querySelectorAll('[data-ra=sp]');
    for (var i = 0; i < s.length; i++) s[i].className = 'b' + (+s[i].getAttribute('data-v') === R.speed ? ' on' : '');
    $('rFollow').className = 'b' + (R.follow ? ' on' : '');
    $('rFollow').textContent = R.follow ? '확대·이동 따라가기: 켬' : '확대·이동 따라가기: 끔';
  }
  function replayReset() {
    R.ctx.globalAlpha = 1; R.ctx.globalCompositeOperation = 'source-over'; R.ctx.fillStyle = doc.paper; R.ctx.fillRect(0, 0, W, H);
    R.i = 0; R.cur = null; R.st = null; R.pt = 0; $('rPen').textContent = '';
  }
  function advanceTo(pt) {
    for (;;) {
      if (R.cur) {
        var it = R.cur, n = it.op.q.length / 2, f = (pt - it.rt0) / Math.max(1, it.rt1 - it.rt0);
        if (f >= 1) { R.st.upTo(R.ctx, n, true); R.cur = null; R.st = null; }
        else { var k = Math.floor(f * n); if (k >= 2) R.st.upTo(R.ctx, k, false); break; }
      }
      if (R.i >= R.items.length) break;
      var nx = R.items[R.i];
      if (nx.rt0 > pt) break;
      R.i++;
      if (nx.ty === 'o') {
        if (nx.op.k === 's') {
          R.cur = nx; R.st = new Stroker(nx.op, doc.paper);
          $('rPen').innerHTML = PENS[nx.op.p].name + ' <span style="display:inline-block;width:16px;height:16px;border-radius:8px;vertical-align:middle;border:1px solid #fff;background:' + nx.op.c + '"></span>';
        } else applyOp(R.ctx, nx.op, doc.paper, W, H);
      }
    }
  }
  function viewAt(pt) {
    var vs = R.views;
    if (!R.follow || !vs.length) { var z = fitZ(); return { z: z, a: 0, ox: (vw - W * z) / 2, oy: (vh - H * z) / 2 }; }
    var a = 0, b = vs.length - 1;
    if (pt <= vs[0].rt) a = 0;
    else { while (a < b) { var m = Math.ceil((a + b) / 2); if (vs[m].rt <= pt) a = m; else b = m - 1; } }
    var cur = vs[a], cx = cur.cx, cy = cur.cy, zz = cur.z, aa = cur.a;
    if (a < vs.length - 1) {
      var nx = vs[a + 1], gap = nx.rt - cur.rt, win = gap <= 250 ? gap : 220;
      var f = (pt - (nx.rt - win)) / Math.max(1, win);
      if (f > 0) { if (f > 1) f = 1; f = f * f * (3 - 2 * f); cx = cur.cx + (nx.cx - cur.cx) * f; cy = cur.cy + (nx.cy - cur.cy) * f; zz = Math.exp(Math.log(cur.z) + (Math.log(nx.z) - Math.log(cur.z)) * f); aa = cur.a + (nx.a - cur.a) * f; }
    }
    var V = { z: zz, a: aa, ox: 0, oy: 0 };
    placeAt(V, cx, cy, vw / 2, vh / 2);
    clampView(V); return V;
  }
  function fmtT(ms) { var s = Math.floor(ms / 1000), m = Math.floor(s / 60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function rloop() {
    if (!inReplay) return;
    var now = +new Date(), dt = Math.min(100, now - R.last); R.last = now;
    if (R.play) {
      R.pt += dt * R.speed;
      if (R.pt >= R.total) { R.pt = R.total; R.play = false; advanceTo(R.pt); setRBtns(); }
      else advanceTo(R.pt);
    }
    R.view = viewAt(R.pt);
    if (!R.drag) $('rSeek').value = Math.round(R.pt / R.total * 1000);
    $('rTime').textContent = fmtT(R.pt) + ' / ' + fmtT(R.total);
    markFull();
    RAF(rloop);
  }
  function replaySeek(f) {
    var target = Math.max(0, Math.min(R.total, f * R.total));
    if (target < R.pt) replayReset();
    R.pt = target; advanceTo(R.pt);
    if (R.pt >= R.total) R.play = false;
    setRBtns();
  }
  function closeReplay() {
    inReplay = false; document.body.className = '';
    if (R) { R.cv.width = R.cv.height = 0; R = null; }
    layout(); markFull();
  }
  $('rSeek').addEventListener('touchstart', function () { if (R) R.drag = true; }, false);
  $('rSeek').addEventListener('mousedown', function () { if (R) R.drag = true; }, false);
  $('rSeek').addEventListener('input', function () { if (R) { R.drag = true; $('rTime').textContent = fmtT(this.value / 1000 * R.total) + ' / ' + fmtT(R.total); } }, false);
  $('rSeek').addEventListener('change', function () { if (R) { replaySeek(this.value / 1000); R.drag = false; } }, false);
  document.addEventListener('touchend', function () { if (R) setTimeout(function () { if (R) R.drag = false; }, 50); }, false);

  /* ---------- 버튼 처리 ---------- */
  function actHome() { saveNow(); location.href = 'draw.html'; }
  document.addEventListener('click', function (e) {
    var t = e.target, act = null, ra = null, tl = null, sw = null;
    while (t && t !== document.body) {
      if (!act && t.getAttribute && t.getAttribute('data-act')) act = t;
      if (!ra && t.getAttribute && t.getAttribute('data-ra')) ra = t;
      if (!tl && t.getAttribute && t.getAttribute('data-t')) tl = t;
      if (!sw && t.getAttribute && t.getAttribute('data-c')) sw = t;
      t = t.parentNode;
    }
    if (ra && R) {
      var a = ra.getAttribute('data-ra');
      if (a === 'play') { if (R.pt >= R.total) { replayReset(); R.play = true; } else R.play = !R.play; setRBtns(); R.last = +new Date(); }
      else if (a === 'sp') { R.speed = +ra.getAttribute('data-v'); setRBtns(); }
      else if (a === 'follow') { R.follow = !R.follow; setRBtns(); }
      else if (a === 'close') closeReplay();
      return;
    }
    if (tl && !inReplay) {
      var id = tl.getAttribute('data-t'); tool.pen = id; hand = false;
      if (mode === 'none') refreshTools();
      return;
    }
    if (sw && !inReplay) {
      tool.color = sw.getAttribute('data-c');
      if (tool.pen === 'eraser') tool.pen = 'pen';
      hand = false; refreshTools(); return;
    }
    if (!act) return;
    var k = act.getAttribute('data-act');
    if (k === 'home') actHome();
    else if (k === 'undo') doUndo();
    else if (k === 'redo') doRedo();
    else if (k === 'clear') { if (mode === 'none' && confirm('그림을 전부 지울까요?\n(다음 획을 그리기 전까지는 "취소"로 되돌릴 수 있어요)')) { var op = { k: 'c', t: ts(), d: 0 }; applyOp(dctx, op, doc.paper, W, H); commitOp(op); markFull(); } }
    else if (k === 'hand') { hand = !hand; refreshTools(); }
    else if (k === 'fit') { var z = fitZ(); view.z = z; view.a = 0; view.ox = (vw - W * z) / 2; view.oy = (vh - H * z) / 2; clampView(view); recView(true); markFull(); }
    else if (k === 'upright') { var pc = inv(view, vw / 2, vh / 2); view.a = 0; placeAt(view, pc.x, pc.y, vw / 2, vh / 2); clampView(view); recView(true); markFull(); }
    else if (k === 'fs') { tool.fs = +act.getAttribute('data-v'); refreshTools(); }
    else if (k === 'z100') { setZoomAround(1, vw / 2, vh / 2); recView(true); markFull(); }
    else if (k === 'replay') { if (mode === 'none') startReplay(); }
    else if (k === 'img') exportImg();
    else if (k === 'send') sendToPC();
    else if (k === 'imgclose') { $('imgov').style.display = 'none'; $('outimg').src = ''; }
    else if (k === 'coldlg') { paintColDlg(); $('colov').style.display = 'block'; }
    else if (k === 'colcancel') $('colov').style.display = 'none';
    else if (k === 'colok') {
      var hx = hsv2hex(hsv.h, hsv.s, hsv.v);
      if (customColors.indexOf(hx) < 0) { customColors.push(hx); if (customColors.length > 12) customColors.shift(); try { localStorage.setItem('drawCustom', JSON.stringify(customColors)); } catch (e2) {} }
      tool.color = hx; if (tool.pen === 'eraser') tool.pen = 'pen'; hand = false;
      $('colov').style.display = 'none'; buildPalette(); layout();
    }
  }, false);
  $('sz').addEventListener('input', function () { tool.size = +this.value; $('szl').textContent = this.value; drawSizeDot(); }, false);
  $('al').addEventListener('input', function () { tool.alpha = +this.value / 100; $('all').textContent = this.value + '%'; drawSizeDot(); }, false);
  $('al').addEventListener('change', function () { refreshTools(); }, false);
  window.addEventListener('resize', function () { setTimeout(layout, 50); }, false);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 300); }, false);

  /* ---------- 시작: 주소의 ?id=기존그림 또는 ?new=1&w=&h=&paper=로 분기 ---------- */
  function parseQS() {
    var qs = {}, raw = location.search.replace(/^\?/, ''), parts, i, p;
    if (raw) {
      parts = raw.split('&');
      for (i = 0; i < parts.length; i++) { p = parts[i].split('='); qs[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }
    }
    return qs;
  }
  buildPalette();
  layout();
  window.addEventListener('load', layout, false);
  (function start() {
    var qs = parseQS();
    if (qs.id) { openDoc(qs.id); return; }
    if (qs['new']) {
      var W_ = Math.max(64, Math.min(3072, parseInt(qs.w, 10) || 1024));
      var H_ = Math.max(64, Math.min(2304, parseInt(qs.h, 10) || 768));
      var paper = /^#[0-9a-fA-F]{6}$/.test(qs.paper) ? qs.paper : '#ffffff';
      newDocFromParams(W_, H_, paper);
      return;
    }
    location.href = 'draw.html';
  })();
})();
</script>
