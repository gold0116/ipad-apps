<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>내 음악</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  h2 { font-size: 18px; margin: 20px 0 8px; border-left: 5px solid #2f6fed; padding-left: 8px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  input[type=text], textarea { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 10px; font-family: inherit; }
  textarea { height: 110px; font-size: 13px; font-family: monospace; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; overflow: hidden; }
  #list li.on { background: #2f6fed; color: #fff; }
  #list .nm { font-size: 17px; font-weight: bold; }
  #list .sub { font-size: 13px; opacity: .75; margin: 2px 0 8px; }
  #list .btn { padding: 8px 16px; font-size: 15px; margin: 2px 4px 2px 0; }
  .row { margin: 8px 0; font-size: 16px; }
  select { font-size: 16px; padding: 6px; }
  #msg { font-size: 14px; margin-top: 6px; }
  .err { color: #c33; } .ok { color: #1a7f3c; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 내 음악</div>
<div class="wrap">

  <div class="card" id="player">
    <div id="now" style="font-size:16px;font-weight:bold">재생할 곡을 고르세요</div>
    <div class="row">
      <label><input type="checkbox" id="loop" checked> 반복</label>
      &nbsp; 속도 <select id="spd"><option value="0.6">0.6×</option><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
      <button class="btn red" id="stop" style="padding:8px 16px;font-size:15px;margin-left:8px">정지</button>
    </div>
    <div id="hint" style="font-size:13px;color:#888"></div>
  </div>

  <h2>곡 목록</h2>
  <ul id="list"></ul>
  <p id="empty" style="color:#888;font-size:15px;display:none">저장된 곡이 없어요. 아래에서 곡 텍스트를 붙여넣어 저장하세요.</p>

  <h2>곡 추가</h2>
  <p style="font-size:14px;margin:0 0 8px"><a href="midi-export.html" style="color:#2f6fed">MIDI 파일에서 곡 텍스트 만들기 →</a></p>
  <div class="card">
    <p style="margin:0 0 4px;font-size:14px">곡 이름</p>
    <input type="text" id="nm" placeholder="(비우면 텍스트 안의 이름을 써요)">
    <p style="margin:10px 0 4px;font-size:14px">곡 텍스트</p>
    <textarea id="tx" placeholder="노트북 서버의 MIDI 변환 페이지에서 복사한 텍스트를 여기에 붙여넣으세요"></textarea>
    <div style="margin-top:8px"><button class="btn" id="save">저장</button> <button class="btn gray" id="try">미리 듣기</button></div>
    <div id="msg"></div>
  </div>

  <p style="font-size:13px;color:#888;margin-top:16px">곡은 이 기기의 브라우저에만 저장돼요(GitHub에 올라가지 않아요). 저장한 곡은 <b>테트리스</b>의 배경음으로도 고를 수 있어요. 소리가 안 나면 화면 오른쪽 위 "소리 켜짐"을 확인하세요.</p>
</div>
<script src="sound.js?v=47"></script>
<script>
(function () {
  var KEY = 'mymusic-list-v1';
  var list = [], playingId = null;
  function $(i) { return document.getElementById(i); }
  function load() { try { list = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { list = []; } }
  function store() { try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { say('저장 공간이 부족하거나 저장할 수 없어요', true); return false; } }
  function say(t, err) { $('msg').className = err ? 'err' : 'ok'; $('msg').textContent = t; }
  function fmt(sec) { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60); }

  // ---- "피아노 대표 예제" 캐논 변주곡(파헬벨, 공개 도메인) 자동 등록 ----
  // 유명한 그라운드 베이스(D-A-Bm-F#m-G-D-G-A, 2박씩 8개가 한 바퀴, 10바퀴
  // 반복)를 깔고, 그 위에 멜로디를 "베이스만 → 단순 제시(2분음표) → 중간
  // 밀도(4분음표) → 8분음표 변주 → 16분음표 변주(절정) → 다시 8분음표 →
  // 4분음표 → 단순 제시(재현) → 베이스만(마무리)" 순서로 점점 density를
  // 올렸다 내리는 편곡(바로크 "디비전" 변주 기법 참고 — 원곡 그대로의
  // 28개 변주 전곡을 악보/MIDI에서 그대로 옮긴 건 아니고, 같은 기법으로
  // 직접 작곡한 약 2분짜리 편곡). "짧아서 부족하다"는 피드백으로 64박자
  // (약 46초, 4바퀴)에서 160박자(약 114초, 10바퀴)로 확장함.
  // 사용자 기기에 한 번만 자동으로 추가/갱신해 두고(버전 플래그로 구분),
  // 지운 뒤에는 같은 버전으로 다시 안 넣음.
  var CANON_SONG = {"name":"캐논 변주곡 (파헬벨)","bpm":84,"beats":160,"mix":"band","notes":[[0,50,1.8],[2,45,1.8],[4,47,1.8],[6,42,1.8],[8,43,1.8],[10,38,1.8],[12,43,1.8],[14,45,1.8],[16,50,1.8],[16,78,1.8],[18,45,1.8],[18,76,1.8],[20,47,1.8],[20,74,1.8],[22,42,1.8],[22,73,1.8],[24,43,1.8],[24,71,1.8],[26,38,1.8],[26,69,1.8],[28,43,1.8],[28,71,1.8],[30,45,1.8],[30,73,1.8],[32,50,1.8],[32,62,0.9],[33,66,0.9],[34,45,1.8],[34,69,0.9],[35,73,0.9],[36,47,1.8],[36,71,0.9],[37,74,0.9],[38,42,1.8],[38,66,0.9],[39,69,0.9],[40,43,1.8],[40,67,0.9],[41,71,0.9],[42,38,1.8],[42,62,0.9],[43,66,0.9],[44,43,1.8],[44,67,0.9],[45,71,0.9],[46,45,1.8],[46,69,0.9],[47,73,0.9],[48,50,1.8],[48,62,0.45],[48.5,64,0.45],[49,66,0.45],[49.5,67,0.45],[50,45,1.8],[50,69,0.45],[50.5,71,0.45],[51,73,0.45],[51.5,74,0.45],[52,47,1.8],[52,71,0.45],[52.5,73,0.45],[53,74,0.45],[53.5,76,0.45],[54,42,1.8],[54,66,0.45],[54.5,67,0.45],[55,69,0.45],[55.5,71,0.45],[56,43,1.8],[56,67,0.45],[56.5,69,0.45],[57,71,0.45],[57.5,73,0.45],[58,38,1.8],[58,62,0.45],[58.5,64,0.45],[59,66,0.45],[59.5,67,0.45],[60,43,1.8],[60,67,0.45],[60.5,69,0.45],[61,71,0.45],[61.5,73,0.45],[62,45,1.8],[62,69,0.45],[62.5,71,0.45],[63,73,0.45],[63.5,74,0.45],[64,50,1.8],[64,62,0.22],[64.25,64,0.22],[64.5,66,0.22],[64.75,67,0.22],[65,69,0.22],[65.25,71,0.22],[65.5,73,0.22],[65.75,74,0.22],[66,45,1.8],[66,69,0.22],[66.25,71,0.22],[66.5,73,0.22],[66.75,74,0.22],[67,76,0.22],[67.25,78,0.22],[67.5,79,0.22],[67.75,81,0.22],[68,47,1.8],[68,71,0.22],[68.25,73,0.22],[68.5,74,0.22],[68.75,76,0.22],[69,78,0.22],[69.25,79,0.22],[69.5,81,0.22],[69.75,83,0.22],[70,42,1.8],[70,66,0.22],[70.25,67,0.22],[70.5,69,0.22],[70.75,71,0.22],[71,73,0.22],[71.25,74,0.22],[71.5,76,0.22],[71.75,78,0.22],[72,43,1.8],[72,67,0.22],[72.25,69,0.22],[72.5,71,0.22],[72.75,73,0.22],[73,74,0.22],[73.25,76,0.22],[73.5,78,0.22],[73.75,79,0.22],[74,38,1.8],[74,62,0.22],[74.25,64,0.22],[74.5,66,0.22],[74.75,67,0.22],[75,69,0.22],[75.25,71,0.22],[75.5,73,0.22],[75.75,74,0.22],[76,43,1.8],[76,67,0.22],[76.25,69,0.22],[76.5,71,0.22],[76.75,73,0.22],[77,74,0.22],[77.25,76,0.22],[77.5,78,0.22],[77.75,79,0.22],[78,45,1.8],[78,69,0.22],[78.25,71,0.22],[78.5,73,0.22],[78.75,74,0.22],[79,76,0.22],[79.25,78,0.22],[79.5,79,0.22],[79.75,81,0.22],[80,50,1.8],[80,74,0.22],[80.25,73,0.22],[80.5,71,0.22],[80.75,69,0.22],[81,67,0.22],[81.25,66,0.22],[81.5,64,0.22],[81.75,62,0.22],[82,45,1.8],[82,81,0.22],[82.25,79,0.22],[82.5,78,0.22],[82.75,76,0.22],[83,74,0.22],[83.25,73,0.22],[83.5,71,0.22],[83.75,69,0.22],[84,47,1.8],[84,83,0.22],[84.25,81,0.22],[84.5,79,0.22],[84.75,78,0.22],[85,76,0.22],[85.25,74,0.22],[85.5,73,0.22],[85.75,71,0.22],[86,42,1.8],[86,78,0.22],[86.25,76,0.22],[86.5,74,0.22],[86.75,73,0.22],[87,71,0.22],[87.25,69,0.22],[87.5,67,0.22],[87.75,66,0.22],[88,43,1.8],[88,79,0.22],[88.25,78,0.22],[88.5,76,0.22],[88.75,74,0.22],[89,73,0.22],[89.25,71,0.22],[89.5,69,0.22],[89.75,67,0.22],[90,38,1.8],[90,74,0.22],[90.25,73,0.22],[90.5,71,0.22],[90.75,69,0.22],[91,67,0.22],[91.25,66,0.22],[91.5,64,0.22],[91.75,62,0.22],[92,43,1.8],[92,79,0.22],[92.25,78,0.22],[92.5,76,0.22],[92.75,74,0.22],[93,73,0.22],[93.25,71,0.22],[93.5,69,0.22],[93.75,67,0.22],[94,45,1.8],[94,81,0.22],[94.25,79,0.22],[94.5,78,0.22],[94.75,76,0.22],[95,74,0.22],[95.25,73,0.22],[95.5,71,0.22],[95.75,69,0.22],[96,50,1.8],[96,67,0.45],[96.5,66,0.45],[97,64,0.45],[97.5,62,0.45],[98,45,1.8],[98,74,0.45],[98.5,73,0.45],[99,71,0.45],[99.5,69,0.45],[100,47,1.8],[100,76,0.45],[100.5,74,0.45],[101,73,0.45],[101.5,71,0.45],[102,42,1.8],[102,71,0.45],[102.5,69,0.45],[103,67,0.45],[103.5,66,0.45],[104,43,1.8],[104,73,0.45],[104.5,71,0.45],[105,69,0.45],[105.5,67,0.45],[106,38,1.8],[106,67,0.45],[106.5,66,0.45],[107,64,0.45],[107.5,62,0.45],[108,43,1.8],[108,73,0.45],[108.5,71,0.45],[109,69,0.45],[109.5,67,0.45],[110,45,1.8],[110,74,0.45],[110.5,73,0.45],[111,71,0.45],[111.5,69,0.45],[112,50,1.8],[112,62,0.9],[113,66,0.9],[114,45,1.8],[114,69,0.9],[115,73,0.9],[116,47,1.8],[116,71,0.9],[117,74,0.9],[118,42,1.8],[118,66,0.9],[119,69,0.9],[120,43,1.8],[120,67,0.9],[121,71,0.9],[122,38,1.8],[122,62,0.9],[123,66,0.9],[124,43,1.8],[124,67,0.9],[125,71,0.9],[126,45,1.8],[126,69,0.9],[127,73,0.9],[128,50,1.8],[128,78,1.8],[130,45,1.8],[130,76,1.8],[132,47,1.8],[132,74,1.8],[134,42,1.8],[134,73,1.8],[136,43,1.8],[136,71,1.8],[138,38,1.8],[138,69,1.8],[140,43,1.8],[140,71,1.8],[142,45,1.8],[142,73,1.8],[144,50,1.8],[146,45,1.8],[148,47,1.8],[150,42,1.8],[152,43,1.8],[154,38,1.8],[156,43,1.8],[158,45,1.8]]};
  function seedCanon() {
    var FLAG = 'canonSeeded-v2', already = false;
    try { already = !!localStorage.getItem(FLAG); } catch (e) { return; }
    if (already) return;
    try {
      var idx = -1, i;
      for (i = 0; i < list.length; i++) if (list[i].name === CANON_SONG.name) idx = i;
      var entry = { id: idx >= 0 ? list[idx].id : 's' + new Date().getTime(), name: CANON_SONG.name, count: CANON_SONG.notes.length, seconds: CANON_SONG.beats * 60 / CANON_SONG.bpm, text: JSON.stringify(CANON_SONG) };
      if (idx >= 0) list[idx] = entry; else list.push(entry);
      store();
    } catch (e) {}
    try { localStorage.setItem(FLAG, '1'); } catch (e) {}
  }

  function parseText(txt) {
    var o;
    try { o = JSON.parse(txt.replace(/^\s+|\s+$/g, '')); } catch (e) { return { ok: false, error: '텍스트 형식이 맞지 않아요. 변환 페이지에서 만든 텍스트를 처음부터 끝까지 그대로 붙여넣으세요.' }; }
    var r = SFX.defineSong('__check', o);
    if (!r.ok) return { ok: false, error: '곡으로 읽을 수 없어요: ' + r.error };
    return { ok: true, obj: o, count: r.count, seconds: r.seconds };
  }

  function render() {
    var ul = $('list'); ul.innerHTML = '';
    $('empty').style.display = list.length ? 'none' : 'block';
    for (var i = 0; i < list.length; i++) (function (s) {
      var li = document.createElement('li'); li.className = s.id === playingId ? 'on' : '';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = s.name;
      var sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = '음 ' + s.count + '개 · ' + fmt(s.seconds);
      var bp = document.createElement('button'); bp.className = 'btn'; bp.textContent = s.id === playingId ? '다시 재생' : '재생'; bp.onclick = function () { play(s); };
      var bd = document.createElement('button'); bd.className = 'btn gray'; bd.textContent = '삭제';
      bd.onclick = function () {
        if (!confirm('"' + s.name + '"을(를) 삭제할까요?')) return;
        if (playingId === s.id) stop();
        for (var k = 0; k < list.length; k++) if (list[k].id === s.id) { list.splice(k, 1); break; }
        store(); render();
      };
      li.appendChild(nm); li.appendChild(sub); li.appendChild(bp); li.appendChild(bd); ul.appendChild(li);
    })(list[i]);
  }

  function playObj(id, obj, name) {
    var r = SFX.defineSong('cur_' + id, obj);
    if (!r.ok) { say('재생할 수 없어요: ' + r.error, true); return false; }
    SFX.setLoop($('loop').checked);
    SFX.setSong('cur_' + id);
    SFX.setTempo(parseFloat($('spd').value));
    SFX.musicStart(true);
    playingId = id; $('now').textContent = '재생 중: ' + name;
    $('hint').textContent = SFX.isMuted() ? '효과음이 꺼져 있어 소리가 안 나요. 오른쪽 위 "소리 꺼짐"을 눌러 켜세요.' : (SFX.isMusicMuted() ? '배경음이 꺼져 있어요(테트리스의 "배경음" 버튼으로 켜세요).' : '');
    return true;
  }
  function play(s) { if (playObj(s.id, JSON.parse(s.text), s.name)) render(); }
  function stop() { SFX.musicStop(true); playingId = null; $('now').textContent = '재생할 곡을 고르세요'; render(); }

  $('stop').onclick = stop;
  $('loop').onchange = function () { SFX.setLoop(this.checked); };
  $('spd').onchange = function () { SFX.setTempo(parseFloat(this.value)); };
  SFX.onMusicEnd(function () { playingId = null; $('now').textContent = '재생할 곡을 고르세요'; render(); });

  $('try').onclick = function () {
    var p = parseText($('tx').value);
    if (!p.ok) { say(p.error, true); return; }
    say('미리 듣기: 음 ' + p.count + '개 · ' + fmt(p.seconds), false);
    playObj('__try', p.obj, $('nm').value || p.obj.name || '미리 듣기');
  };
  $('save').onclick = function () {
    var raw = $('tx').value;
    if (!raw.replace(/\s/g, '')) { say('곡 텍스트를 붙여넣으세요', true); return; }
    var p = parseText(raw);
    if (!p.ok) { say(p.error, true); return; }
    var name = $('nm').value.replace(/^\s+|\s+$/g, '') || p.obj.name || '이름 없는 곡';
    p.obj.name = name;
    list.push({ id: 's' + new Date().getTime(), name: name, count: p.count, seconds: p.seconds, text: JSON.stringify(p.obj) });
    if (!store()) { list.pop(); return; }
    $('tx').value = ''; $('nm').value = '';
    say('"' + name + '" 저장했어요', false);
    render();
  };

  // 노트북 서버의 MIDI 변환 화면에서 "보내기"로 넘어온 곡을 자동 등록 (주소 뒤 #import=곡텍스트)
  function importFromHash() {
    var h = location.hash || '';
    if (h.indexOf('#import=') !== 0) return;
    var raw = '';
    try { raw = decodeURIComponent(h.substr(8)); } catch (e) { say('넘어온 주소가 올바르지 않아요', true); return; }
    var p = parseText(raw);
    if (!p.ok) { say(p.error, true); return; }
    var name = p.obj.name || '가져온 곡';
    list.push({ id: 's' + new Date().getTime(), name: name, count: p.count, seconds: p.seconds, text: JSON.stringify(p.obj) });
    if (store()) { say('"' + name + '"을(를) 가져왔어요', false); $('hint').style.color = '#1a7f3c'; $('hint').textContent = '"' + name + '"을(를) 가져왔어요. 아래 곡 목록에서 재생하세요.'; }
    else list.pop();
    try { history.replaceState(null, '', location.pathname); } catch (e) { location.hash = ''; }
  }

  load(); seedCanon(); importFromHash(); render();
})();
</script>
</body>
