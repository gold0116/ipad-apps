<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>구슬 추첨</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  textarea { -webkit-user-select: text; user-select: text; }
  #info { text-align: center; font-size: 16px; margin: 6px 0; }
  canvas { display: block; margin: 0 auto; background: #1d2330; border-radius: 8px; }
  .pad { text-align: center; margin-top: 8px; }
  #names { width: 100%; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #ccc; display: block; -webkit-box-sizing: border-box; box-sizing: border-box; }
  #msg { text-align: center; font-size: 14px; color: #e5484d; min-height: 20px; margin-top: 4px; }
  #legend { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-top: 12px; }
  .chip { background: #fff; border-radius: 10px; padding: 6px 10px; margin: 3px; font-size: 14px; display: -webkit-flex; display: flex; align-items: center; -webkit-box-shadow: 0 1px 3px rgba(0,0,0,.12); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .chip .rk { font-weight: bold; margin-left: 6px; color: #2f6fed; }
  #resultBox { text-align: center; background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; -webkit-box-shadow: 0 2px 6px rgba(0,0,0,.12); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  #resultBox ul { text-align: left; font-size: 17px; list-style: none; padding-left: 8px; margin: 8px 0; }
  #resultBox ul li { padding: 2px 0; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 구슬 추첨</div>
<div class="wrap">
  <div id="setup">
    <p style="color:#666;font-size:14px;line-height:1.5">이름을 한 줄에 한 명씩 입력하세요. 구슬이 핀 사이로 떨어지며 섞이다가 도착하는 순서로 순위가 정해집니다 (최소 2명 · 최대 30명).</p>
    <textarea id="names" rows="8" placeholder="철수&#10;영희&#10;민수"></textarea>
    <div id="msg"></div>
    <div class="pad">
      <button class="btn" id="start">추첨 시작</button>
      <button class="btn gray" id="demo">예시 이름 채우기</button>
    </div>
  </div>
  <div id="race" style="display:none">
    <div id="resultBox" style="display:none"></div>
    <div id="info">도착 <b id="arrived">0</b> / <b id="total">0</b></div>
    <canvas id="cv" width="320" height="560"></canvas>
    <div class="pad">
      <button class="btn" id="again" style="display:none">다시 추첨</button>
      <button class="btn gray" id="edit">이름 다시 입력</button>
    </div>
    <div id="legend"></div>
  </div>
</div>
<script src="sound.js?v=26"></script>
<script src="touchfx.js?v=2"></script>
<script>
(function () {
  // 아이디어 참고: https://github.com/lazygyu/roulette ("마블 룰렛")
  // - 그 저장소는 물리 엔진이 box2d-wasm(WebAssembly)이라 iOS 9.3.5/Safari 9인
  //   iPad 2에서 그대로 못 돌림(Safari 11부터 WebAssembly 지원) + TypeScript/Parcel
  //   빌드 구조라 이 저장소의 "단일 HTML, ES5" 방식과도 안 맞음.
  // - 그래서 코드를 가져오지 않고 "구슬이 핀 사이로 떨어지며 좁은 문을 통과한
  //   순서로 순위가 정해진다"는 메커니즘만 참고해 원, 원-직선 충돌로 새로 구현함.
  // - README에 적힌 대로 "마블 룰렛"/"Marble Roulette" 이름은 그 저장소의 상표라
  //   그대로 쓸 수 없어서, 이 저장소에서는 "구슬 추첨"이라는 다른 이름을 씀.
  // - 추첨(뽑기)의 공정성이 핵심이라, 시작한 뒤에는 터치로 결과에 손댈 수 없게
  //   한다(터치 효과는 touchfx.js로 순전히 눈에만 보이는 장식일 뿐 물리에 영향 없음).
  // - 계속 도는 자기 rAF 루프가 있는 캔버스 게임이라 vfx.js는 안 쓰고(CLAUDE.md
  //   규칙 4), breakout.html의 burst()/stepFx() 패턴을 그대로 따라 파티클을
  //   직접 그린다.
  var W = 320, H = 560, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var tfx = TouchFX.attach(cv);
  function $(id) { return document.getElementById(id); }
  function now() { return Date.now(); }

  function layout() {
    var w = Math.min(window.innerWidth - 24, (window.innerHeight - 200) / 1.75, 420);
    if (w < 220) w = 220;
    cv.style.width = w + 'px'; cv.style.height = (w * 1.75) + 'px';
  }
  window.addEventListener('resize', layout, false);
  window.addEventListener('orientationchange', layout, false);
  layout();

  // ---- 보드 모양: y값에 따른 좌/우 경계(가운데가 좁아지는 "허리" 2곳 = 깔때기) ----
  // 1번 깔때기(F1): 완전히 막히진 않는 중간 정도 병목 — 여기서 서로 앞서거니
  // 뒤서거니 뒤섞이게 함. 2번 깔때기(F2): 도착선 바로 앞의 좁은 문 — 한 줄로
  // 줄서듯 빠져나가게 해서 "거의 다 왔는데 역전" 긴장감을 만듦.
  var F1_TOP = 150, F1_BOT = 190, F1_REOPEN = 230, G1_W = 70;
  var F2_TOP = 400, F2_BOT = 440, G2_W = 18;
  var FINISH_Y = 480;
  var G1L = (W - G1_W) / 2, G1R = (W + G1_W) / 2;
  var G2L = (W - G2_W) / 2, G2R = (W + G2_W) / 2;
  function lerp(a, b, t) { return a + (b - a) * t; }
  function boardLeftX(y) {
    if (y < F1_TOP) return 0;
    if (y < F1_BOT) return lerp(0, G1L, (y - F1_TOP) / (F1_BOT - F1_TOP));
    if (y < F1_REOPEN) return lerp(G1L, 0, (y - F1_BOT) / (F1_REOPEN - F1_BOT));
    if (y < F2_TOP) return 0;
    if (y < F2_BOT) return lerp(0, G2L, (y - F2_TOP) / (F2_BOT - F2_TOP));
    if (y < FINISH_Y) return G2L;
    return 0;
  }
  function boardRightX(y) {
    if (y < F1_TOP) return W;
    if (y < F1_BOT) return lerp(W, G1R, (y - F1_TOP) / (F1_BOT - F1_TOP));
    if (y < F1_REOPEN) return lerp(G1R, W, (y - F1_BOT) / (F1_REOPEN - F1_BOT));
    if (y < F2_TOP) return W;
    if (y < F2_BOT) return lerp(W, G2R, (y - F2_TOP) / (F2_BOT - F2_TOP));
    if (y < FINISH_Y) return G2R;
    return W;
  }
  function boundaryPolyline(side) {
    var fn = side === 'l' ? boardLeftX : boardRightX;
    var ys = [0, F1_TOP, F1_BOT, F1_REOPEN, F2_TOP, F2_BOT, FINISH_Y - 0.01, FINISH_Y, H];
    var pts = [], i;
    for (i = 0; i < ys.length; i++) pts.push([fn(ys[i]), ys[i]]);
    return pts;
  }

  // ---- 핀(갈톤 보드식 지그재그 배치) ----
  var PINR = 3.5;
  function makePins(yStart, yEnd, rowGap, colGap) {
    var out = [], y, row = 0, offset, x;
    for (y = yStart; y <= yEnd; y += rowGap, row++) {
      offset = (row % 2) ? colGap / 2 : 0;
      for (x = 16 + offset; x <= W - 16; x += colGap) out.push({ x: x, y: y, r: PINR });
    }
    return out;
  }
  var PINS = makePins(26, 136, 24, 26).concat(makePins(244, 386, 24, 26));

  var BALLR = 6, GRAVITY = 0.00048, WALL_REST = 0.55, PIN_REST = 0.55, BALL_REST = 0.8, MAXV = 0.85;
  var SUBSTEPS = 3, RACE_TIMEOUT = 45000;
  var PALETTE = ['#e5484d', '#f08a24', '#f5d90a', '#3fb950', '#3b82f6', '#8a63d2', '#e056c4', '#30d5c8', '#ff6b9d', '#5ec9f0', '#c8472f', '#7ee787', '#ffd166', '#2f6fed'];

  var particles = [], flashT = 0, shakeT = 0;
  function burst(cx, cy, color, count) {
    for (var i = 0; i < (count || 8); i++) {
      var a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 1.4;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 1.2 + Math.random() * 1.6, c: color });
    }
  }
  function stepFx() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= 0.04;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (flashT > 0) flashT = Math.max(0, flashT - 0.06);
    if (shakeT > 0) shakeT = Math.max(0, shakeT - 0.08);
  }

  var names = [], balls = [], state = 'setup', raceTimeoutAt = 0, finishedCount = 0, lastPinSoundAt = 0;
  var last = 0, loopStarted = false;

  try {
    var savedNames = localStorage.getItem('balldrawNames');
    if (savedNames) $('names').value = savedNames;
  } catch (e) {}

  function parseNames() {
    var raw = $('names').value.split('\n'), out = [], i, t;
    for (i = 0; i < raw.length; i++) { t = raw[i].replace(/^\s+|\s+$/g, ''); if (t) out.push(t); }
    return out;
  }

  function buildBalls() {
    balls = [];
    var cols = Math.min(names.length, 10), i, row, col, spacing = (W - 40) / cols, x, y;
    for (i = 0; i < names.length; i++) {
      row = Math.floor(i / cols); col = i % cols;
      x = 20 + (col + 0.5) * spacing + (Math.random() * 8 - 4);
      y = -20 - row * 26 - Math.random() * 10;
      balls.push({
        name: names[i], idx: i, color: PALETTE[i % PALETTE.length],
        x: x, y: y, vx: (Math.random() * 0.1 - 0.05), vy: 0, r: BALLR,
        finished: false, rank: -1, trail: [], lastX: x, lastY: y, stuckT: 1200
      });
    }
  }

  function buildLegend() {
    var el = $('legend'), i, html = '';
    for (i = 0; i < balls.length; i++) {
      html += '<span class="chip" id="chip' + i + '"><span class="dot" style="background:' + balls[i].color + '"></span>' + escapeHtml(balls[i].name) + '<span class="rk" id="rk' + i + '"></span></span>';
    }
    el.innerHTML = html;
  }
  function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function startRace() {
    names = parseNames();
    $('msg').textContent = '';
    if (names.length < 2) { $('msg').textContent = '2명 이상 입력하세요.'; return; }
    if (names.length > 30) { $('msg').textContent = '최대 30명까지라 앞의 30명만 씁니다.'; names = names.slice(0, 30); }
    try { localStorage.setItem('balldrawNames', $('names').value); } catch (e) {}
    $('setup').style.display = 'none';
    $('race').style.display = '';
    $('resultBox').style.display = 'none';
    $('again').style.display = 'none';
    $('total').textContent = names.length;
    buildBalls(); buildLegend();
    finishedCount = 0; $('arrived').textContent = '0';
    particles = []; flashT = 0; shakeT = 0;
    state = 'running'; raceTimeoutAt = now() + RACE_TIMEOUT;
    if (!loopStarted) { loopStarted = true; last = now(); frame(); }
  }

  function finishBall(b) {
    if (b.finished) return;
    b.finished = true; finishedCount++; b.rank = finishedCount;
    $('rk' + b.idx).textContent = b.rank + '위';
    $('arrived').textContent = finishedCount;
    SFX.play('point');
    burst(b.x, b.y, b.color, 16);
    flashT = 0.4;
    if (finishedCount === balls.length) finishRace();
  }

  function forceFinishRemaining() {
    var left = [], i;
    for (i = 0; i < balls.length; i++) if (!balls[i].finished) left.push(balls[i]);
    left.sort(function (a, b) { return b.y - a.y; });
    for (i = 0; i < left.length; i++) finishBall(left[i]);
  }

  function finishRace() {
    state = 'done'; shakeT = 1; SFX.play('win');
    var ranked = balls.slice().sort(function (a, b) { return a.rank - b.rank; });
    var medal = ['🥇', '🥈', '🥉'], html = '<div style="font-size:18px;font-weight:bold">추첨 결과</div><ul>', i;
    for (i = 0; i < ranked.length; i++) {
      html += '<li>' + (medal[i] || ((i + 1) + '.')) + ' ' + escapeHtml(ranked[i].name) + '</li>';
    }
    html += '</ul>';
    $('resultBox').innerHTML = html;
    $('resultBox').style.display = '';
    $('again').style.display = '';
  }

  function resolveBounds(b) {
    var bl = boardLeftX(b.y) + b.r, br = boardRightX(b.y) - b.r;
    if (b.x < bl) { b.x = bl; if (b.vx < 0) b.vx = -b.vx * WALL_REST; }
    if (b.x > br) { b.x = br; if (b.vx > 0) b.vx = -b.vx * WALL_REST; }
  }
  function resolvePin(b, p) {
    var dx = b.x - p.x, dy = b.y - p.y, dist = Math.sqrt(dx * dx + dy * dy), minD = b.r + p.r;
    if (dist > 0 && dist < minD) {
      var nx = dx / dist, ny = dy / dist, overlap = minD - dist;
      b.x += nx * overlap; b.y += ny * overlap;
      var vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        b.vx -= (1 + PIN_REST) * vn * nx; b.vy -= (1 + PIN_REST) * vn * ny;
        var tx = -ny, ty = nx, jitter = (Math.random() * 0.1 - 0.05);
        b.vx += tx * jitter; b.vy += ty * jitter;
        if (now() - lastPinSoundAt > 70 && -vn > 0.1) { lastPinSoundAt = now(); SFX.play('tick'); }
      }
    }
  }
  function resolveBallBall(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, dist = Math.sqrt(dx * dx + dy * dy), minD = a.r + b.r;
    if (dist > 0 && dist < minD) {
      var nx = dx / dist, ny = dy / dist, overlap = minD - dist;
      a.x -= nx * overlap / 2; a.y -= ny * overlap / 2; b.x += nx * overlap / 2; b.y += ny * overlap / 2;
      var rvx = b.vx - a.vx, rvy = b.vy - a.vy, van = rvx * nx + rvy * ny;
      if (van < 0) {
        var imp = -(1 + BALL_REST) * van / 2;
        a.vx -= imp * nx; a.vy -= imp * ny; b.vx += imp * nx; b.vy += imp * ny;
      }
    }
  }

  function physicsStep(dt) {
    var sub = SUBSTEPS, sdt = dt / sub, s, i, j, b;
    for (s = 0; s < sub; s++) {
      for (i = 0; i < balls.length; i++) {
        b = balls[i];
        b.vy += GRAVITY * sdt;
        var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (sp > MAXV) { b.vx *= MAXV / sp; b.vy *= MAXV / sp; }
        b.x += b.vx * sdt; b.y += b.vy * sdt;
        if (!b.finished) resolveBounds(b);
      }
      for (i = 0; i < balls.length; i++) {
        if (balls[i].finished) continue;
        for (j = 0; j < PINS.length; j++) resolvePin(balls[i], PINS[j]);
      }
      for (i = 0; i < balls.length; i++) {
        if (balls[i].finished) continue;
        for (j = i + 1; j < balls.length; j++) { if (balls[j].finished) continue; resolveBallBall(balls[i], balls[j]); }
      }
      for (i = 0; i < balls.length; i++) {
        b = balls[i];
        if (b.y > H - b.r) { b.y = H - b.r; if (b.vy > 0) b.vy = -b.vy * 0.3; b.vx *= 0.9; }
      }
    }
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      b.trail.push({ x: b.x, y: b.y, life: 1 }); if (b.trail.length > 6) b.trail.shift();
      for (j = 0; j < b.trail.length; j++) b.trail[j].life -= 0.18;
      if (!b.finished && b.y >= FINISH_Y) finishBall(b);
      // 핀 틈이나 깔때기 모서리에 끼어 거의 안 움직이면 살짝 흔들어 빼냄(공정성을
      // 위해 아주 작은 무작위 흔들림만 — 방향을 특정 쪽으로 유리하게 밀지 않음)
      if (!b.finished) {
        b.stuckT -= dt;
        if (b.stuckT <= 0) {
          if (Math.abs(b.x - b.lastX) + Math.abs(b.y - b.lastY) < 5) {
            var ang = Math.random() * Math.PI * 2;
            b.vx += Math.cos(ang) * 0.3; b.vy += Math.sin(ang) * 0.3 - 0.1;
          }
          b.lastX = b.x; b.lastY = b.y; b.stuckT = 1200;
        }
      }
    }
    if (state === 'running' && now() > raceTimeoutAt) forceFinishRemaining();
  }

  function drawPoly(pts) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  function draw() {
    ctx.save();
    if (shakeT > 0) ctx.translate((Math.random() * 2 - 1) * shakeT * 4, (Math.random() * 2 - 1) * shakeT * 4);
    ctx.clearRect(-10, -10, W + 20, H + 20);
    ctx.fillStyle = '#1d2330'; ctx.fillRect(0, 0, W, H);
    if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flashT * 0.3) + ')'; ctx.fillRect(0, 0, W, H); }
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
    drawPoly(boundaryPolyline('l')); drawPoly(boundaryPolyline('r'));
    ctx.fillStyle = '#cfd6e6';
    for (var i = 0; i < PINS.length; i++) { ctx.beginPath(); ctx.arc(PINS[i].x, PINS[i].y, PINS[i].r, 0, Math.PI * 2); ctx.fill(); }
    ctx.save(); ctx.setLineDash && ctx.setLineDash([5, 4]);
    ctx.strokeStyle = '#f5d90a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(G2L - 2, FINISH_Y); ctx.lineTo(G2R + 2, FINISH_Y); ctx.stroke();
    ctx.restore();
    for (i = 0; i < balls.length; i++) {
      var b = balls[i], t;
      for (t = 0; t < b.trail.length; t++) {
        var tp = b.trail[t]; if (tp.life <= 0) continue;
        ctx.globalAlpha = tp.life * 0.3;
        ctx.beginPath(); ctx.arc(tp.x, tp.y, b.r * 0.7, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
      if (b.finished) { ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = p.c; ctx.fill();
    }
    ctx.globalAlpha = 1;
    tfx.draw(ctx);
    ctx.restore();
  }

  function loop() {
    var t = now(), dt = t - last; last = t;
    if (dt > 40) dt = 40; if (dt < 0) dt = 0;
    if (state === 'running') physicsStep(dt);
    stepFx(); draw();
    frame();
  }
  function frame() {
    var r = window.requestAnimationFrame || window.webkitRequestAnimationFrame;
    if (r) r.call(window, loop); else setTimeout(loop, 16);
  }

  $('start').onclick = startRace;
  $('demo').onclick = function () {
    $('names').value = '철수\n영희\n민수\n지영\n현우\n수진';
  };
  $('again').onclick = function () {
    $('resultBox').style.display = 'none'; $('again').style.display = 'none';
    buildBalls(); buildLegend();
    finishedCount = 0; $('arrived').textContent = '0';
    particles = []; flashT = 0; shakeT = 0;
    state = 'running'; raceTimeoutAt = now() + RACE_TIMEOUT;
  };
  $('edit').onclick = function () {
    state = 'setup';
    $('race').style.display = 'none'; $('setup').style.display = '';
  };
})();
</script>
<script>SFX.attachBgm();</script>
</body>
</html>
