<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>구슬 추첨</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  textarea { -webkit-user-select: text; user-select: text; }
  #info { text-align: center; font-size: 16px; margin: 6px 0; }
  canvas { display: block; margin: 0 auto; background: #1d2330; border-radius: 8px; }
  .pad { text-align: center; margin-top: 8px; }
  #names { width: 100%; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #ccc; display: block; -webkit-box-sizing: border-box; box-sizing: border-box; }
  #msg { text-align: center; font-size: 14px; color: #e5484d; min-height: 20px; margin-top: 4px; }
  #legend { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-top: 12px; }
  .chip { background: #fff; border-radius: 10px; padding: 6px 10px; margin: 3px; font-size: 14px; display: -webkit-flex; display: flex; align-items: center; -webkit-box-shadow: 0 1px 3px rgba(0,0,0,.12); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .chip .rk { font-weight: bold; margin-left: 6px; color: #2f6fed; }
  #resultBox { text-align: center; background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; -webkit-box-shadow: 0 2px 6px rgba(0,0,0,.12); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  #resultBox ul { text-align: left; font-size: 17px; list-style: none; padding-left: 8px; margin: 8px 0; }
  #resultBox ul li { padding: 2px 0; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 구슬 추첨</div>
<div class="wrap">
  <div id="setup">
    <p style="color:#666;font-size:14px;line-height:1.5">이름을 한 줄에 한 명씩 입력하세요. 구슬이 핀/회전 날개 사이로 떨어지며 섞이다가 도착하는 순서로 순위가 정해집니다 (최소 2명 · 최대 30명). 코스는 lazygyu/roulette의 1번 스테이지("Wheel of fortune") 구조를 참고했습니다.</p>
    <textarea id="names" rows="8" placeholder="철수&#10;영희&#10;민수"></textarea>
    <div id="msg"></div>
    <div class="pad">
      <button class="btn" id="start">추첨 시작</button>
      <button class="btn gray" id="demo">예시 이름 채우기</button>
    </div>
  </div>
  <div id="race" style="display:none">
    <div id="resultBox" style="display:none"></div>
    <div id="info">도착 <b id="arrived">0</b> / <b id="total">0</b></div>
    <canvas id="cv" width="364" height="480"></canvas>
    <div class="pad">
      <button class="btn" id="again" style="display:none">다시 추첨</button>
      <button class="btn gray" id="edit">이름 다시 입력</button>
    </div>
    <div id="legend"></div>
  </div>
</div>

    for (i = 0; i < balls.length; i++) {
      html += '<span class="chip" id="chip' + i + '"><span class="dot" style="background:' + balls[i].color + '"></span>' + escapeHtml(balls[i].name) + '<span class="rk" id="rk' + i + '"></span></span>';
    }
    el.innerHTML = html;
  }
  function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function startRace() {
    names = parseNames();
    $('msg').textContent = '';
    if (names.length < 2) { $('msg').textContent = '2명 이상 입력하세요.'; return; }
    if (names.length > 30) { $('msg').textContent = '최대 30명까지라 앞의 30명만 씁니다.'; names = names.slice(0, 30); }
    try { localStorage.setItem('balldrawNames', $('names').value); } catch (e) {}
    $('setup').style.display = 'none';
    $('race').style.display = '';
    $('resultBox').style.display = 'none';
    $('again').style.display = 'none';
    $('total').textContent = names.length;
    buildBalls(); buildLegend();
    finishedCount = 0; $('arrived').textContent = '0';
    particles = []; flashT = 0; shakeT = 0;
    state = 'running'; raceTimeoutAt = now() + RACE_TIMEOUT;
    if (!loopStarted) { loopStarted = true; last = now(); frame(); }
  }

  function finishBall(b) {
    if (b.finished) return;
    b.finished = true; finishedCount++; b.rank = finishedCount;
    $('rk' + b.idx).textContent = b.rank + '위';
    $('arrived').textContent = finishedCount;
    SFX.play('point');
    burst(b.x, b.y, b.color, 16);
    flashT = 0.4;
    if (finishedCount === balls.length) finishRace();
  }

  function forceFinishRemaining() {
    var left = [], i;
    for (i = 0; i < balls.length; i++) if (!balls[i].finished) left.push(balls[i]);
    left.sort(function (a, b) { return b.y - a.y; });
    for (i = 0; i < left.length; i++) finishBall(left[i]);
  }

  function finishRace() {
    state = 'done'; shakeT = 1; SFX.play('win');
    var ranked = balls.slice().sort(function (a, b) { return a.rank - b.rank; });
    var medal = ['🥇', '🥈', '🥉'], html = '<div style="font-size:18px;font-weight:bold">추첨 결과</div><ul>', i;
    for (i = 0; i < ranked.length; i++) {
      html += '<li>' + (medal[i] || ((i + 1) + '.')) + ' ' + escapeHtml(ranked[i].name) + '</li>';
    }
    html += '</ul>';
    $('resultBox').innerHTML = html;
    $('resultBox').style.display = '';
    $('again').style.display = '';
  }

  // ---- 원-선분 충돌: 가장 가까운 점에 투영해서 법선 방향으로 반사 + 쿨롱 마찰 근사 ----
  function resolveSegment(b, x1, y1, x2, y2, restitution) {
    var ex = x2 - x1, ey = y2 - y1, lenSq = ex * ex + ey * ey;
    if (lenSq < 1e-9) return;
    var t = ((b.x - x1) * ex + (b.y - y1) * ey) / lenSq;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    var cx = x1 + ex * t, cy = y1 + ey * t;
    var dx = b.x - cx, dy = b.y - cy, dist = Math.sqrt(dx * dx + dy * dy);
    var minD = b.r + CPAD;
    if (dist >= minD || dist <= 0) return;
    var nx = dx / dist, ny = dy / dist, overlap = minD - dist;
    b.x += nx * overlap; b.y += ny * overlap;
    var vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    var jn = -(1 + restitution) * vn;
    b.vx += jn * nx; b.vy += jn * ny;
    var tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
    var maxJt = FRICTION * Math.abs(jn), jt = -vt;
    if (jt > maxJt) jt = maxJt; else if (jt < -maxJt) jt = -maxJt;
    b.vx += jt * tx; b.vy += jt * ty;
    if (-vn > 2 && now() - lastPinSoundAt > 70) { lastPinSoundAt = now(); SFX.play('tick'); }
  }

  // ---- 원-회전사각형(OBB) 충돌: 로컬 좌표로 바꿔서 판정, 회전체는 접촉면 속도(ω×r)도 전달 ----
  function resolveBox(b, box) {
    var cos = Math.cos(box.angle), sin = Math.sin(box.angle);
    var dx = b.x - box.cx, dy = b.y - box.cy;
    var lx = dx * cos + dy * sin, ly = -dx * sin + dy * cos;
    var hx = box.hx, hy = box.hy;
    var cxl = lx < -hx ? -hx : (lx > hx ? hx : lx);
    var cyl = ly < -hy ? -hy : (ly > hy ? hy : ly);
    var ddx = lx - cxl, ddy = ly - cyl, dist = Math.sqrt(ddx * ddx + ddy * ddy);
    var minD = b.r + CPAD, nxl, nyl, overlap;
    if (dist >= minD) return;
    if (dist > 1e-6) { nxl = ddx / dist; nyl = ddy / dist; overlap = minD - dist; }
    else {
      var px = hx - Math.abs(lx), py = hy - Math.abs(ly);
      if (px < py) { nxl = lx < 0 ? -1 : 1; nyl = 0; overlap = px + minD; }
      else { nxl = 0; nyl = ly < 0 ? -1 : 1; overlap = py + minD; }
    }
    var nx = nxl * cos - nyl * sin, ny = nxl * sin + nyl * cos;
    b.x += nx * overlap; b.y += ny * overlap;
    var rx = cxl * cos - cyl * sin, ry = cxl * sin + cyl * cos;
    var svx = 0, svy = 0;
    if (box.angVel) { svx = -box.angVel * ry; svy = box.angVel * rx; }
    var relvx = b.vx - svx, relvy = b.vy - svy;
    var vn = relvx * nx + relvy * ny;
    if (vn >= 0) return;
    var jn = -(1 + box.restitution) * vn;
    relvx += jn * nx; relvy += jn * ny;
    var tx = -ny, ty = nx, vt = relvx * tx + relvy * ty;
    var maxJt = FRICTION * Math.abs(jn), jt = -vt;
    if (jt > maxJt) jt = maxJt; else if (jt < -maxJt) jt = -maxJt;
    relvx += jt * tx; relvy += jt * ty;
    b.vx = relvx + svx; b.vy = relvy + svy;
    if (-vn > 2 && now() - lastPinSoundAt > 70) { lastPinSoundAt = now(); SFX.play('tick'); }
  }

  function resolveBallBall(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, dist = Math.sqrt(dx * dx + dy * dy), minD = a.r + b.r;
    if (dist > 0 && dist < minD) {
      var nx = dx / dist, ny = dy / dist, overlap = minD - dist;
      a.x -= nx * overlap / 2; a.y -= ny * overlap / 2; b.x += nx * overlap / 2; b.y += ny * overlap / 2;
      var rvx = b.vx - a.vx, rvy = b.vy - a.vy, van = rvx * nx + rvy * ny;
      if (van < 0) {
        var imp = -(1 + BALL_REST) * van / 2;
        a.vx -= imp * nx; a.vy -= imp * ny; b.vx += imp * nx; b.vy += imp * ny;
      }
    }
  }

  function physicsStep(dtMs) {
    var dt = dtMs / 1000; // 이 아래부터는 전부 '초' 단위(원본 box2d 상수와 그대로 맞음)
    var sub = SUBSTEPS, sdt = dt / sub, s, i, j, k, b;
    for (s = 0; s < sub; s++) {
      for (k = 0; k < boxes.length; k++) { var bx = boxes[k]; if (bx.angVel) bx.angle += bx.angVel * sdt; }
      for (i = 0; i < balls.length; i++) {
        b = balls[i]; if (b.finished) continue;
        b.vy += GRAVITY * sdt;
        var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (sp > MAXV) { b.vx *= MAXV / sp; b.vy *= MAXV / sp; }
        b.x += b.vx * sdt; b.y += b.vy * sdt;
      }
      for (i = 0; i < balls.length; i++) {
        b = balls[i]; if (b.finished) continue;
        for (j = 0; j < walls.length; j++) {
          var w = walls[j], ss = w.segs;
          for (var si = 0; si < ss.length; si++) resolveSegment(b, ss[si].x1, ss[si].y1, ss[si].x2, ss[si].y2, w.restitution);
        }
        for (j = 0; j < boxes.length; j++) resolveBox(b, boxes[j]);
      }
      for (i = 0; i < balls.length; i++) {
        if (balls[i].finished) continue;
        for (j = i + 1; j < balls.length; j++) { if (balls[j].finished) continue; resolveBallBall(balls[i], balls[j]); }
      }
    }
    var leadY = SPAWN_Y, anyUnfinished = false;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (!b.finished) {
        b.trail.push({ x: b.x, y: b.y, life: 1 }); if (b.trail.length > 6) b.trail.shift();
        for (j = 0; j < b.trail.length; j++) b.trail[j].life -= 0.18;
        if (b.y >= GOAL_Y) { finishBall(b); }
        else {
          anyUnfinished = true;
          if (b.y > leadY) leadY = b.y;
          // 핀 틈이나 장애물 모서리에 끼어 거의 안 움직이면 살짝 흔들어 빼냄
          // (공정성을 위해 아주 작은 무작위 흔들림만 — 특정 방향으로 밀지 않음)
          b.stuckT -= dtMs;
          if (b.stuckT <= 0) {
            if (Math.abs(b.x - b.lastX) + Math.abs(b.y - b.lastY) < 0.06) {
              var ang = Math.random() * Math.PI * 2;
              b.vx += Math.cos(ang) * 8; b.vy += Math.sin(ang) * 8 + 2;
            }
            b.lastX = b.x; b.lastY = b.y; b.stuckT = 600;
          }
          // 회전 날개 근처에서 맞을 때마다 위로 튕겨 올라가며 제자리를 맴도는
          // "공명" 현상은 위 체크로 못 잡는다(매번 눈에 띄게 움직이긴 하므로) —
          // 그래서 2초 동안 실제로 "아래로 내려간 거리"가 거의 없으면(왕복만
          // 했으면) 공명을 깨고 나갈 만큼 확실한 충격을 한 번 더 준다.
          b.progressT -= dtMs;
          if (b.progressT <= 0) {
            if (b.y - b.progressY < 0.4) {
              b.vx += Math.random() * 6 - 3; b.vy += 12 + Math.random() * 4;
            }
            b.progressY = b.y; b.progressT = 2000;
          }
        }
      }
    }
    var camTarget = anyUnfinished ? (leadY + (CH / PPU) * 0.18) : (GOAL_Y + (CH / PPU) * 0.1);
    var camMin = SPAWN_Y + (CH / PPU) * 0.5, camMax = GOAL_Y + (CH / PPU) * 0.4;
    if (camTarget < camMin) camTarget = camMin; if (camTarget > camMax) camTarget = camMax;
    camY += (camTarget - camY) * Math.min(1, dtMs * 0.004);
    if (state === 'running' && now() > raceTimeoutAt) forceFinishRemaining();
  }

  function sx(x) { return x * PPU; }
  function sy(y) { return (y - camY) * PPU + CH / 2; }

  function draw() {
    ctx.save();
    if (shakeT > 0) ctx.translate((Math.random() * 2 - 1) * shakeT * 4, (Math.random() * 2 - 1) * shakeT * 4);
    ctx.clearRect(-10, -10, CW + 20, CH + 20);
    ctx.fillStyle = '#1d2330'; ctx.fillRect(0, 0, CW, CH);
    if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flashT * 0.3) + ')'; ctx.fillRect(0, 0, CW, CH); }

    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    for (var wi = 0; wi < walls.length; wi++) {
      var ss = walls[wi].segs;
      ctx.beginPath(); ctx.moveTo(sx(ss[0].x1), sy(ss[0].y1));
      for (var si = 0; si < ss.length; si++) ctx.lineTo(sx(ss[si].x2), sy(ss[si].y2));
      ctx.stroke();
    }
    for (var bi = 0; bi < boxes.length; bi++) {
      var box = boxes[bi];
      ctx.save();
      ctx.translate(sx(box.cx), sy(box.cy)); ctx.rotate(box.angle);
      ctx.fillStyle = box.kinematic ? '#ff8a3d' : (box.restitution > 0.5 ? '#ff6b9d' : '#cfd6e6');
      ctx.fillRect(-box.hx * PPU, -box.hy * PPU, box.hx * 2 * PPU, box.hy * 2 * PPU);
      ctx.restore();
    }
    ctx.save(); ctx.setLineDash && ctx.setLineDash([6, 5]);
    ctx.strokeStyle = '#f5d90a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(sx(1), sy(GOAL_Y)); ctx.lineTo(sx(25), sy(GOAL_Y)); ctx.stroke();
    ctx.restore();

    for (var i = 0; i < balls.length; i++) {
      var b = balls[i], t;
      for (t = 0; t < b.trail.length; t++) {
        var tp = b.trail[t]; if (tp.life <= 0) continue;
        ctx.globalAlpha = tp.life * 0.3;
        ctx.beginPath(); ctx.arc(sx(tp.x), sy(tp.y), b.r * PPU * 0.7, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(sx(b.x), sy(b.y), b.r * PPU, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
      if (b.finished) { ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.r, 0, Math.PI * 2); ctx.fillStyle = p.c; ctx.fill();
    }
    ctx.globalAlpha = 1;
    tfx.draw(ctx);
    ctx.restore();
  }

  function loop() {
    var t = now(), dt = t - last; last = t;
    if (dt > 40) dt = 40; if (dt < 0) dt = 0;
    if (state === 'running') physicsStep(dt);
    stepFx(); draw();
    frame();
  }
  function frame() {
    var r = window.requestAnimationFrame || window.webkitRequestAnimationFrame;
    if (r) r.call(window, loop); else setTimeout(loop, 16);
  }

  $('start').onclick = startRace;
  $('demo').onclick = function () {
    $('names').value = '철수\n영희\n민수\n지영\n현우\n수진';
  };
  $('again').onclick = function () {
    $('resultBox').style.display = 'none'; $('again').style.display = 'none';
    buildBalls(); buildLegend();
    finishedCount = 0; $('arrived').textContent = '0';
    particles = []; flashT = 0; shakeT = 0;
    state = 'running'; raceTimeoutAt = now() + RACE_TIMEOUT;
  };
  $('edit').onclick = function () {
    state = 'setup';
    $('race').style.display = 'none'; $('setup').style.display = '';
  };
})();
</script>
<script>SFX.attachBgm();</script>
</body>
</html>
