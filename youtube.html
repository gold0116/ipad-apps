<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>내 유튜브</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  h2 { font-size: 18px; margin: 20px 0 8px; border-left: 5px solid #2f6fed; padding-left: 8px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  input[type=text], select { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 10px; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; overflow: hidden; }
  #list .nm { font-size: 17px; font-weight: bold; word-break: break-all; }
  #list .sub { font-size: 12px; color: #888; margin: 2px 0 8px; }
  #list .btn { padding: 10px 18px; font-size: 16px; margin: 2px 6px 2px 0; text-decoration: none; }
  .small { font-size: 13px; color: #777; }
  .ok { color: #1a7f3c; } .warn { color: #c33; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 내 유튜브</div>
<div class="wrap">

  <div class="card">
    <p style="margin:0 0 6px;font-size:15px">iPad 2에서는 앱 안에서 유튜브를 재생할 수 없어서(시험 결과), 목록에서 영상을 누르면 <b>유튜브 사이트가 바로 그 영상으로</b> 열려요. 뒤로 가기를 누르면 이 목록으로 돌아와요.</p>
    <div class="small">열기 방식</div>
    <select id="mode">
      <option value="m.youtube.com">모바일 사이트 (m.youtube.com) - 가벼움</option>
      <option value="www.youtube.com">일반 사이트 (www.youtube.com)</option>
    </select>
  </div>

  <h2>영상 목록</h2>
  <ul id="list"></ul>
  <p id="empty" class="small" style="display:none">저장된 영상이 없어요. 아래에서 유튜브 주소를 추가하세요.</p>

  <h2>영상 추가</h2>
  <div class="card">
    <p class="small" style="margin:0 0 4px">이름</p>
    <input type="text" id="nm" placeholder="예: 좋아하는 노래">
    <p class="small" style="margin:10px 0 4px">유튜브 주소</p>
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=... 또는 https://youtu.be/...">
    <div style="margin-top:8px"><button class="btn" id="save">저장</button></div>
    <div id="msg" style="margin-top:6px"></div>
  </div>

  <p class="small" style="margin-top:16px">주소 목록만 이 기기에 저장되고 GitHub에는 올라가지 않아요. 백업/복원에도 포함돼요. 영상은 유튜브 사이트에서 재생되므로 인터넷이 필요해요.</p>
</div>
<script>
(function () {
  var KEY = 'myyoutube-list-v1', MKEY = 'myyoutubeMode';
  var list = [];
  function $(i) { return document.getElementById(i); }
  function load() { try { list = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { list = []; } }
  function store() { try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { say('저장할 수 없어요(저장 공간 부족 등)', true); return false; } }
  function say(t, err) { $('msg').className = err ? 'warn' : 'ok'; $('msg').textContent = t; }
  try { var sv = localStorage.getItem(MKEY); if (sv) $('mode').value = sv; } catch (e) {}

  function videoId(u) {
    u = (u || '').replace(/^\s+|\s+$/g, '');
    if (/^[\w-]{11}$/.test(u)) return u;
    var m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
    return m ? m[1] : null;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function link(vid) { return 'https://' + $('mode').value + '/watch?v=' + vid; }

  function render() {
    var ul = $('list'); ul.innerHTML = '';
    $('empty').style.display = list.length ? 'none' : 'block';
    for (var i = 0; i < list.length; i++) (function (s) {
      var li = document.createElement('li');
      li.innerHTML = '<div class="nm">' + esc(s.name) + '</div><div class="sub">' + esc(s.vid) + '</div>';
      var a = document.createElement('a'); a.className = 'btn'; a.textContent = '열기'; a.href = link(s.vid);
      var bd = document.createElement('button'); bd.className = 'btn gray'; bd.textContent = '삭제';
      bd.onclick = function () {
        if (!confirm('"' + s.name + '"을(를) 삭제할까요?')) return;
        for (var k = 0; k < list.length; k++) if (list[k].id === s.id) { list.splice(k, 1); break; }
        store(); render();
      };
      li.appendChild(a); li.appendChild(bd); ul.appendChild(li);
    })(list[i]);
  }

  $('mode').onchange = function () { try { localStorage.setItem(MKEY, this.value); } catch (e) {} render(); };
  $('save').onclick = function () {
    var v = videoId($('url').value);
    if (!v) { say('유튜브 주소가 아니에요. watch?v=… 또는 youtu.be/… 주소를 넣으세요.', true); return; }
    var name = $('nm').value.replace(/^\s+|\s+$/g, '') || ('영상 ' + v);
    list.push({ id: 'y' + new Date().getTime(), name: name, vid: v });
    if (!store()) { list.pop(); return; }
    $('nm').value = ''; $('url').value = ''; say('"' + name + '" 저장했어요', false); render();
  };

  load(); render();
})();
</script>
</body>
</html>
