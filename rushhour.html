<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>러시아워</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #info { text-align: center; font-size: 17px; margin: 4px 0 8px; }
  #cv { display: block; margin: 0 auto; background: #1d2330; border-radius: 8px; touch-action: none; }
  #msg { text-align: center; font-size: 20px; font-weight: bold; min-height: 30px; margin-top: 8px; }
  .pad { text-align: center; margin-top: 8px; }
  .pad select { font-size: 16px; padding: 2px; }
  #lvPad { margin-bottom: 8px; }
  #lvPad select { font-size: 15px; padding: 3px; margin: 0 3px; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 러시아워</div>
<div class="wrap">
  <div id="info">이동 <b id="mv">0</b> · 최고 <b id="best">-</b></div>
  <div class="pad" id="lvPad"><select id="diffSel"></select><select id="numSel"></select></div>
  <canvas id="cv" width="240" height="240"></canvas>
  <div id="msg"></div>
  <div class="pad"><button class="btn gray" id="re">다시 시작</button> <button class="btn" id="unsolved">미완료 레벨 시작</button></div>
  <p style="text-align:center;color:#888">빨간 차를 끌어서 오른쪽 틈(노란 표시)으로 빼내세요. 차는 자기 방향으로만 밀 수 있어요.</p>
</div>
<script>
(function () {
  // 레벨 데이터는 rushhour-levels.txt(용량 때문에 이 파일과 분리, app.appcache에
  // 등록해서 오프라인에서도 읽힘)에서 불러온다. 형식: 쉼표가 없는 줄은
  // "가로x세로 난이도 최적이동수" 헤더(새 보드 시작), 쉼표가 있는 줄은 그 보드의
  // 차량(id,x,y,orientation,length) 한 대. 이 쉼표 유무로 구분하는 방식이라
  // 구분자 글자를 따로 정할 필요가 없다.
  //
  // 338개 전부 ihansolo/rush-hour-app의 "Pre-solved Rush Hour puzzle database"
  // (Michael Fogleman의 rush 라이브러리로 만들고 BFS로 최적 이동 수까지 검증된
  // 데이터, michaelfogleman.com/rush/)에서 가져옴 — easy(4~9수) 80개, medium
  // (10~19수) 157개, hard(20~35수) 31개, expert(36수 이상) 70개. 전부 이미
  // BFS로 풀이 가능함이 검증된 데이터라 우리 쪽에서 따로 재검증 안 함(파싱 후
  // 겹침/범위만 다시 확인). 이전에 쓰던 KaKariki02/rushHour 기반 8개 보드
  // (6x6 4 + 9x9 3 + 12x12 1)는 전부 교체됨 — `rushhour-research.md`에 조사
  // 경위를 남겨둠.
  var LEVELS_URL = 'rushhour-levels.txt?v=2';
  var CELL = 40;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  function $(i) { return document.getElementById(i); }

  var DIFF_LABEL = { easy: '쉬움', medium: '보통', hard: '어려움', expert: '최고난도' };
  var PALETTE = ['#2f6fed', '#2a9d4a', '#f4a259', '#6b3fc4', '#17a2b8', '#e8b339', '#8a8f98', '#d9593a', '#4f9ba3', '#a86bd6'];

  var LEVELS = [];

  function parseLevelsText(text) {
    var lines = text.split(/\r?\n/), levels = [], cur = null, i, line, parts, wh, w, h;
    for (i = 0; i < lines.length; i++) {
      line = lines[i];
      if (!line) continue;
      if (line.indexOf(',') === -1) {
        parts = line.split(' ');
        wh = parts[0].split('x');
        w = parseInt(wh[0], 10); h = parseInt(wh[1], 10);
        if (!w || !h) continue;
        cur = { w: w, h: h, diff: parts[1] || '', opt: parseInt(parts[2], 10) || 0, rows: [] };
        levels.push(cur);
      } else if (cur) {
        cur.rows.push(line);
      }
    }
    var out = [];
    for (i = 0; i < levels.length; i++) out.push({ w: levels[i].w, h: levels[i].h, diff: levels[i].diff, opt: levels[i].opt, data: levels[i].rows.join('\n') });
    return out;
  }
  function parseVehicles(s) {
    var lines = s.split('\n'), out = [];
    for (var i = 0; i < lines.length; i++) {
      var p = lines[i].split(',');
      out.push({ id: p[0], x: parseInt(p[1], 10), y: parseInt(p[2], 10), o: p[3], len: parseInt(p[4], 10) });
    }
    return out;
  }

  var W = 6, H = 6, CVW = W * CELL, CVH = H * CELL;
  var vehicles = [], curLevel = 0, moves = 0, done = false, exitRow = 0, colorMap = {};
  var dragIdx = -1, dragAxis = 'x', dragOrigPos = 0, dragLo = 0, dragHi = 0, dragStartClient = 0, isMouseDown = false;

  function vehicleById(id) {
    for (var i = 0; i < vehicles.length; i++) if (vehicles[i].id === id) return vehicles[i];
    return null;
  }
  function assignColors() {
    colorMap = {};
    var n = 0;
    for (var i = 0; i < vehicles.length; i++) {
      if (vehicles[i].id === '#') continue;
      colorMap[vehicles[i].id] = PALETTE[n % PALETTE.length];
      n++;
    }
  }

  function cellsOf(v, x, y) {
    x = (x === undefined) ? v.x : x;
    y = (y === undefined) ? v.y : y;
    var out = [];
    for (var k = 0; k < v.len; k++) out.push(v.o === 'H' ? [x + k, y] : [x, y + k]);
    return out;
  }
  function occupancyExcept(skip) {
    var occ = {}, i, k, c;
    for (i = 0; i < vehicles.length; i++) {
      if (i === skip) continue;
      c = cellsOf(vehicles[i]);
      for (k = 0; k < c.length; k++) occ[c[k][0] + ',' + c[k][1]] = true;
    }
    return occ;
  }
  function boundsFor(v, occ) {
    var pos = v.o === 'H' ? v.x : v.y, lo = pos, hi = pos;
    function free(p) {
      var c = v.o === 'H' ? cellsOf(v, p, v.y) : cellsOf(v, v.x, p);
      for (var k = 0; k < c.length; k++) {
        var cx = c[k][0], cy = c[k][1];
        if (cx < 0 || cx >= W || cy < 0 || cy >= H) return false;
        if (occ[cx + ',' + cy]) return false;
      }
      return true;
    }
    while (free(lo - 1)) lo--;
    while (free(hi + 1)) hi++;
    return { lo: lo, hi: hi };
  }
  function vehicleAt(c, r) {
    for (var i = 0; i < vehicles.length; i++) {
      var cc = cellsOf(vehicles[i]);
      for (var k = 0; k < cc.length; k++) if (cc[k][0] === c && cc[k][1] === r) return i;
    }
    return -1;
  }

  function roundRect(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function draw() {
    var i;
    ctx.clearRect(0, 0, CVW, CVH);
    ctx.fillStyle = '#1d2330';
    ctx.fillRect(0, 0, CVW, CVH);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    for (i = 1; i < W; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, CVH); ctx.stroke(); }
    for (i = 1; i < H; i++) { ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(CVW, i * CELL); ctx.stroke(); }
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(CVW - 4, exitRow * CELL + 6, 4, CELL - 12);
    for (i = 0; i < vehicles.length; i++) {
      var v = vehicles[i];
      var x = v.x * CELL, y = v.y * CELL;
      var w = v.o === 'H' ? v.len * CELL : CELL;
      var h = v.o === 'H' ? CELL : v.len * CELL;
      ctx.fillStyle = v.id === '#' ? '#e5484d' : colorMap[v.id];
      roundRect(x + 2, y + 2, w - 4, h - 4, 7);
      ctx.fill();
      if (v.id === '#') {
        // 다른 벽돌/차랑 색(특히 비슷한 톤의 주황/적갈색)과 헷갈리지 않도록,
        // 빨간 차는 색만으로 구분하지 않고 흰 테두리 + 출구 쪽(오른쪽)을
        // 가리키는 화살표를 항상 그려서 "이게 목표 차"라는 걸 표시한다.
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
        roundRect(x + 2, y + 2, w - 4, h - 4, 7); ctx.stroke();
        var acx = x + w / 2, acy = y + h / 2, s = Math.min(w, h) * 0.22;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.beginPath();
        ctx.moveTo(acx - s * 0.55, acy - s);
        ctx.lineTo(acx + s * 0.85, acy);
        ctx.lineTo(acx - s * 0.55, acy + s);
        ctx.closePath();
        ctx.fill();
      }
      if (i === dragIdx) {
        ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
        roundRect(x + 2, y + 2, w - 4, h - 4, 7); ctx.stroke();
      }
    }
  }

  function celebrate() {
    var r = cv.getBoundingClientRect();
    var ey = (exitRow + 0.5) / H * r.height;
    VFX.flash(cv, '255,209,102');
    for (var n = 0; n < 6; n++) {
      (function (n) {
        setTimeout(function () {
          VFX.burst(cv, r.width - 6, ey, { count: 14, speed: 2.8, colors: ['#ffd166', '#7ee787', '#5ec9f0', '#e5484d'] });
        }, n * 90);
      })(n);
    }
  }

  function checkWin() {
    var red = vehicleById('#');
    if (red.x + red.len !== W) return;
    done = true;
    SFX.play('win');
    celebrate();
    var key = 'bestRush' + curLevel, best = 0, wasSolved = isSolved(curLevel);
    try { best = parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch (e) {}
    if (!best || moves < best) { best = moves; try { localStorage.setItem(key, best); } catch (e) {} }
    $('best').textContent = best;
    if (!wasSolved) { markNumOptionSolved(curLevel); updateDiffCounts(); }
    var opt = LEVELS[curLevel].opt;
    var html = '🎉 탈출 성공! ' + moves + '번 이동';
    if (opt) html += (moves === opt ? ' (최적!)' : ' (최적 ' + opt + '번)');
    if (curLevel < LEVELS.length - 1) html += ' <button class="btn" id="nextLv">다음 레벨</button>';
    else html += ' (전체 완료!)';
    $('msg').innerHTML = html;
    var nb = $('nextLv');
    if (nb) nb.onclick = function () { loadLevel(curLevel + 1); };
  }

  function isSolved(idx) {
    try { return !!localStorage.getItem('bestRush' + idx); } catch (e) { return false; }
  }

  function loadLevel(idx) {
    if (idx < 0 || idx >= LEVELS.length) return;
    curLevel = idx;
    var lvl = LEVELS[idx];
    W = lvl.w; H = lvl.h; CVW = W * CELL; CVH = H * CELL;
    cv.width = CVW; cv.height = CVH;
    vehicles = parseVehicles(lvl.data);
    exitRow = vehicleById('#').y;
    assignColors();
    moves = 0; done = false; dragIdx = -1;
    $('mv').textContent = 0;
    var best = 0;
    try { best = parseInt(localStorage.getItem('bestRush' + idx) || '0', 10) || 0; } catch (e) {}
    $('best').textContent = best ? best : '-';
    $('msg').textContent = '';
    syncSelectsToLevel(idx);
    draw();
  }

  function localPos(e) {
    var r = cv.getBoundingClientRect();
    var t = e.touches && e.touches.length ? e.touches[0] : e;
    return { x: (t.clientX - r.left) / r.width * CVW, y: (t.clientY - r.top) / r.height * CVH, clientX: t.clientX, clientY: t.clientY };
  }

  function start(e) {
    if (done) return;
    var p = localPos(e);
    var c = Math.floor(p.x / CELL), r = Math.floor(p.y / CELL);
    var idx = vehicleAt(c, r);
    if (idx < 0) return;
    dragIdx = idx;
    var v = vehicles[idx];
    dragAxis = v.o === 'H' ? 'x' : 'y';
    dragOrigPos = v[dragAxis];
    dragStartClient = dragAxis === 'x' ? p.clientX : p.clientY;
    var b = boundsFor(v, occupancyExcept(idx));
    dragLo = b.lo; dragHi = b.hi;
    draw();
  }
  function move(e) {
    if (dragIdx < 0) return;
    var p = localPos(e);
    var r = cv.getBoundingClientRect();
    var client = dragAxis === 'x' ? p.clientX : p.clientY;
    var scale = (dragAxis === 'x' ? CVW : CVH) / (dragAxis === 'x' ? r.width : r.height);
    var deltaCells = Math.round((client - dragStartClient) * scale / CELL);
    var pos = dragOrigPos + deltaCells;
    if (pos < dragLo) pos = dragLo;
    if (pos > dragHi) pos = dragHi;
    var v = vehicles[dragIdx];
    if (pos !== v[dragAxis]) {
      v[dragAxis] = pos;
      SFX.play('move');
      draw();
    }
  }
  function finish() {
    if (dragIdx < 0) return;
    var v = vehicles[dragIdx];
    var moved = v[dragAxis] !== dragOrigPos;
    dragIdx = -1;
    if (moved) {
      moves++;
      $('mv').textContent = moves;
      checkWin();
    }
    draw();
  }

  cv.addEventListener('touchstart', function (e) { e.preventDefault(); start(e); }, false);
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); move(e); }, false);
  cv.addEventListener('touchend', function (e) { e.preventDefault(); finish(); }, false);
  cv.addEventListener('mousedown', function (e) { isMouseDown = true; start(e); }, false);
  cv.addEventListener('mousemove', function (e) { if (isMouseDown) move(e); }, false);
  window.addEventListener('mouseup', function () { if (isMouseDown) { isMouseDown = false; finish(); } }, false);
  document.addEventListener('touchmove', function (e) { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') e.preventDefault(); }, false);

  function layout() {
    var avail = Math.min(window.innerWidth - 24, window.innerHeight - 270, 560);
    if (avail < 180) avail = 180;
    cv.style.width = avail + 'px';
    cv.style.height = avail + 'px';
  }
  window.addEventListener('resize', layout, false);
  window.addEventListener('orientationchange', layout, false);
  layout();

  // 레벨이 338개라 하나의 드롭다운에 다 넣으면 스크롤하기 힘들어서, 난이도
  // 선택(diffSel)과 그 난이도 안에서의 번호 선택(numSel)을 분리했다.
  var diffOrder = [], groupsByDiff = {};

  function buildLevelSelect() {
    var diffSel = $('diffSel'), i, key, label, o;
    diffSel.innerHTML = '';
    diffOrder = []; groupsByDiff = {};
    for (i = 0; i < LEVELS.length; i++) {
      key = LEVELS[i].diff || (LEVELS[i].w + '×' + LEVELS[i].h);
      if (!groupsByDiff[key]) { groupsByDiff[key] = []; diffOrder.push(key); }
      groupsByDiff[key].push(i);
    }
    for (i = 0; i < diffOrder.length; i++) {
      key = diffOrder[i]; label = DIFF_LABEL[key] || key;
      o = document.createElement('option');
      o.value = key; o.setAttribute('data-label', label);
      diffSel.appendChild(o);
    }
    updateDiffCounts();
    diffSel.onchange = function () {
      populateNumSel(diffSel.value);
      loadLevel(groupsByDiff[diffSel.value][0]);
    };
  }

  function updateDiffCounts() {
    var diffSel = $('diffSel'), i, key, idxs, solvedN, j;
    for (i = 0; i < diffSel.options.length; i++) {
      key = diffSel.options[i].value;
      idxs = groupsByDiff[key]; solvedN = 0;
      for (j = 0; j < idxs.length; j++) if (isSolved(idxs[j])) solvedN++;
      diffSel.options[i].textContent = diffSel.options[i].getAttribute('data-label') + ' (' + solvedN + '/' + idxs.length + ')';
    }
  }

  function populateNumSel(diffKey) {
    var numSel = $('numSel'), idxs = groupsByDiff[diffKey] || [], i, o;
    numSel.innerHTML = '';
    for (i = 0; i < idxs.length; i++) {
      o = document.createElement('option');
      o.value = idxs[i];
      o.textContent = (i + 1) + (isSolved(idxs[i]) ? ' ✓' : '');
      numSel.appendChild(o);
    }
    numSel.onchange = function () { loadLevel(parseInt(numSel.value, 10)); };
  }

  function markNumOptionSolved(idx) {
    var numSel = $('numSel');
    for (var i = 0; i < numSel.options.length; i++) {
      if (parseInt(numSel.options[i].value, 10) === idx && numSel.options[i].textContent.indexOf('✓') === -1) {
        numSel.options[i].textContent += ' ✓';
        break;
      }
    }
  }

  function syncSelectsToLevel(idx) {
    var diffKey = LEVELS[idx].diff || (LEVELS[idx].w + '×' + LEVELS[idx].h);
    if ($('diffSel').value !== diffKey) {
      $('diffSel').value = diffKey;
      populateNumSel(diffKey);
    }
    $('numSel').value = idx;
  }

  $('re').onclick = function () { loadLevel(curLevel); };
  $('unsolved').onclick = function () {
    var curDiff = $('diffSel').value, idxs = groupsByDiff[curDiff] || [], candidates = [], i;
    for (i = 0; i < idxs.length; i++) if (!isSolved(idxs[i])) candidates.push(idxs[i]);
    if (!candidates.length) {
      for (i = 0; i < LEVELS.length; i++) if (!isSolved(i)) candidates.push(i);
    }
    if (!candidates.length) { $('msg').textContent = '🏆 338개 전부 깼어요!'; return; }
    loadLevel(candidates[Math.floor(Math.random() * candidates.length)]);
  };

  (function boot() {
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var text = (xhr.status === 200 || (xhr.status === 0 && xhr.responseText)) ? xhr.responseText : '';
      LEVELS = text ? parseLevelsText(text) : [];
      if (!LEVELS.length) { $('msg').textContent = '레벨 데이터를 불러오지 못했어요. 온라인 상태에서 한 번 열어 주세요.'; return; }
      buildLevelSelect();
      populateNumSel(diffOrder[0]);
      loadLevel(0);
    };
    xhr.open('GET', LEVELS_URL, true);
    xhr.send();
  })();
})();
</script>
<script src="sound.js?v=31"></script>
<script src="vfx.js?v=2"></script>
<script>SFX.attachBgm();</script>
</body>
</html>
