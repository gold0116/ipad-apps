<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>메모</title>
<link rel="stylesheet" href="style.css">
<style>
  #list { margin: 0; padding: 0; list-style: none; }
  #list li { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 8px; font-size: 18px; white-space: pre-wrap; word-wrap: break-word; }
  #list li small { display: block; color: #999; font-size: 12px; margin-top: 6px; }
  #list li .x { float: right; color: #e5484d; font-size: 15px; padding: 0 0 8px 12px; }
  textarea { width: 100%; height: 110px; font-size: 18px; padding: 12px; border: 1px solid #ccc; border-radius: 12px; font-family: inherit; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 메모</div>
<div class="wrap">
  <textarea id="t" placeholder="메모를 입력하세요"></textarea>
  <button class="btn" id="add">추가</button>
  <ul id="list"></ul>
  <p id="msg" style="color:#e5484d"></p>
</div>
<script>
(function () {
  var KEY = 'memo-list-v1';
  var notes = [];
  var ok = true;
  try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { ok = false; }
  if (!ok) { document.getElementById('msg').textContent = '이 브라우저는 저장이 안 돼요 (사생활 보호 모드를 끄세요).'; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { document.getElementById('msg').textContent = '저장 실패'; } }
  function fmt(ts) { var d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }
  function render() {
    var ul = document.getElementById('list');
    ul.innerHTML = '';
    for (var i = notes.length - 1; i >= 0; i--) {
      (function (idx) {
        var li = document.createElement('li');
        var x = document.createElement('span');
        x.className = 'x'; x.textContent = '삭제';
        x.onclick = function () { if (confirm('삭제할까요?')) { notes.splice(idx, 1); save(); render(); } };
        var body = document.createElement('div');
        body.textContent = notes[idx].text;
        var s = document.createElement('small');
        s.textContent = fmt(notes[idx].ts);
        li.appendChild(x); li.appendChild(body); li.appendChild(s);
        ul.appendChild(li);
      })(i);
    }
  }
  document.getElementById('add').onclick = function () {
    var t = document.getElementById('t');
    var v = t.value.replace(/^\s+|\s+$/g, '');
    if (!v) return;
    notes.push({ text: v, ts: new Date().getTime() });
    t.value = '';
    save(); render();
  };
  render();
})();
</script>
</body>
</html>
