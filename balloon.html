<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>풍선 모험</title>
<link rel="stylesheet" href="style.css">
<style>
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #info { text-align: center; font-size: 18px; margin: 2px 0 6px; }
  canvas { display: block; margin: 0 auto; border-radius: 10px; background: #8ad0ff; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 풍선 모험</div>
<div class="wrap" style="padding:8px 8px 0">
  <div id="info">높이 <b id="m">0</b>m · 코인 <b id="c">0</b> · 목숨 <b id="l">3</b> · 최고 <b id="best">0</b></div>
  <canvas id="cv" width="360" height="540"></canvas>
  <p style="text-align:center;color:#888;margin:6px 0">손가락을 좌우로 움직여 풍선을 조종하세요</p>
</div>
<script>
(function () {
  var W = 360, H = 540;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var state = 'ready', last = 0, overAt = 0;
  var bx, tx, by = 400, objs, deco, dist, nextAt, meters, coins, lives, inv, t, vs, best = 0, hitFlash;
  try { best = parseInt(localStorage.getItem('bestBalloon') || '0', 10) || 0; } catch (e) {}
  function $(i) { return document.getElementById(i); }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function layout() {
    var h = window.innerHeight - 150, w = window.innerWidth - 16;
    var s = Math.min(w, h * W / H);
    if (s < 240) s = 240;
    cv.style.width = Math.round(s) + 'px'; cv.style.height = Math.round(s * H / W) + 'px';
  }
  window.addEventListener('resize', layout, false);
  window.addEventListener('orientationchange', layout, false);
  layout();

  function reset() {
    bx = W / 2; tx = bx; objs = []; deco = []; dist = 0; nextAt = 160; meters = 0; coins = 0; lives = 3; inv = 0; t = 0; vs = 0.12; hitFlash = 0;
    for (var i = 0; i < 6; i++) deco.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(0.6, 1.3) });
  }
  function start() { reset(); state = 'run'; last = 0; }

  function circ(x, y, r, f) { ctx.fillStyle = f; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }

  function spawn() {
    var roll = Math.random(), hard = Math.min(1, meters / 600);
    if (roll < 0.35) { // 동전 줄
      var cx = rnd(50, W - 50), n = Math.floor(rnd(3, 6));
      for (var i = 0; i < n; i++) objs.push({ k: 'coin', x: Math.max(24, Math.min(W - 24, cx + Math.sin(i * 1.3) * 40)), y: -20 - i * 36, r: 11, p: rnd(0, 6) });
    } else if (roll < 0.35 + 0.3 + hard * 0.1) { // 새
      var dir = Math.random() < 0.5 ? 1 : -1;
      objs.push({ k: 'bird', x: dir > 0 ? -20 : W + 20, y: -30, r: 14, dx: dir * rnd(0.06, 0.12 + hard * 0.08) });
    } else { // 먹구름
      objs.push({ k: 'cloud', x: rnd(40, W - 40), y: -50, r: rnd(28, 40) });
    }
    nextAt = rnd(130, 230) - hard * 40;
  }

  function update(dt) {
    t += dt;
    vs = Math.min(0.32, 0.12 + meters * 0.00018);
    meters += vs * dt * 0.05;
    dist += vs * dt;
    if (dist >= nextAt) { dist = 0; spawn(); }
    bx += (tx - bx) * Math.min(1, 0.012 * dt);
    if (bx < 24) bx = 24; if (bx > W - 24) bx = W - 24;
    if (inv > 0) inv -= dt;
    var i, o;
    for (i = 0; i < objs.length; i++) { o = objs[i]; o.y += vs * dt; if (o.dx) o.x += o.dx * dt; }
    for (i = deco.length - 1; i >= 0; i--) { deco[i].y += vs * dt * 0.4; if (deco[i].y > H + 40) { deco[i].y = -40; deco[i].x = rnd(0, W); } }
    var cy = by - 10;
    for (i = objs.length - 1; i >= 0; i--) {
      o = objs[i];
      if (o.y > H + 60 || o.x < -60 || o.x > W + 60) { objs.splice(i, 1); continue; }
      var dx = o.x - bx, dy = o.y - cy, d = Math.sqrt(dx * dx + dy * dy);
      if (o.k === 'coin') { if (d < o.r + 24) { coins++; objs.splice(i, 1); } }
      else if (inv <= 0 && d < o.r + 19) {
        lives--; inv = 1400; hitFlash = 200; objs.splice(i, 1);
        if (lives <= 0) { die(); return; }
      }
    }
    if (hitFlash > 0) hitFlash -= dt;
  }
  function score() { return Math.floor(meters) + coins * 10; }
  function die() {
    state = 'over'; overAt = Date.now();
    if (score() > best) { best = score(); try { localStorage.setItem('bestBalloon', best); } catch (e) {} }
  }

  function drawCloud(x, y, r, f) { circ(x, y, r, f); circ(x - r * 0.8, y + r * 0.2, r * 0.7, f); circ(x + r * 0.8, y + r * 0.2, r * 0.7, f); }

  function draw() {
    var k = Math.min(1, meters / 800);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, k < 0.5 ? '#4aa8e8' : '#1c2a5e'); g.addColorStop(1, k < 0.5 ? '#bfe6ff' : '#5a7fd0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var i, o;
    for (i = 0; i < deco.length; i++) drawCloud(deco[i].x, deco[i].y, 18 * deco[i].s, 'rgba(255,255,255,0.55)');
    for (i = 0; i < objs.length; i++) {
      o = objs[i];
      if (o.k === 'coin') {
        var sc = Math.abs(Math.cos(t / 220 + o.p)) * 0.8 + 0.2;
        ctx.save(); ctx.translate(o.x, o.y); ctx.scale(sc, 1);
        circ(0, 0, o.r, '#d99a00'); circ(0, 0, o.r - 3, '#ffd23f'); ctx.restore();
      } else if (o.k === 'bird') {
        var fl = Math.sin(t / 90) * 8;
        ctx.save(); ctx.translate(o.x, o.y); if (o.dx < 0) ctx.scale(-1, 1);
        circ(0, 0, 9, '#333'); circ(9, -3, 5, '#333');
        ctx.fillStyle = '#f5a623'; ctx.beginPath(); ctx.moveTo(13, -3); ctx.lineTo(20, -1); ctx.lineTo(13, 0); ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-14, -fl); ctx.lineTo(-2, -2); ctx.lineTo(8, -fl * 0.6); ctx.stroke();
        circ(10, -4, 1.5, '#fff');
        ctx.restore();
      } else {
        drawCloud(o.x, o.y, o.r, '#59606e');
        circ(o.x - 8, o.y - 4, 3, '#fff'); circ(o.x + 8, o.y - 4, 3, '#fff');
      }
    }
    // 풍선
    if (!(inv > 0 && Math.floor(t / 100) % 2 === 0)) {
      var tilt = (tx - bx) * 0.004;
      ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.max(-0.25, Math.min(0.25, tilt)));
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-8, 30); ctx.moveTo(10, 8); ctx.lineTo(8, 30); ctx.stroke();
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-10, 30, 20, 13);
      ctx.save(); ctx.translate(0, -18); ctx.scale(0.9, 1.15); circ(0, 0, 26, hitFlash > 0 ? '#fff' : '#e5484d'); ctx.restore();
      ctx.fillStyle = '#c93a3f'; ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(5, 12); ctx.lineTo(0, 6); ctx.fill();
      circ(-9, -28, 6, 'rgba(255,255,255,0.45)');
      ctx.restore();
    }
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4;
    if (state === 'ready') { ctx.font = 'bold 28px sans-serif'; ctx.strokeText('탭하면 시작!', W / 2, 200); ctx.fillText('탭하면 시작!', W / 2, 200); }
    if (state === 'over') {
      ctx.font = 'bold 30px sans-serif'; ctx.strokeText('게임 오버', W / 2, 190); ctx.fillText('게임 오버', W / 2, 190);
      ctx.font = 'bold 20px sans-serif'; ctx.strokeText('점수 ' + score(), W / 2, 225); ctx.fillText('점수 ' + score(), W / 2, 225);
      ctx.strokeText('탭해서 다시 시작', W / 2, 260); ctx.fillText('탭해서 다시 시작', W / 2, 260);
    }
    $('m').textContent = Math.floor(meters); $('c').textContent = coins; $('l').textContent = lives; $('best').textContent = best;
  }

  function loop(ts) {
    if (state === 'run') {
      if (!last) last = ts;
      var dt = Math.min(40, ts - last); last = ts;
      update(dt);
    }
    draw();
    window.requestAnimationFrame(loop);
  }

  function setX(cx) { var r = cv.getBoundingClientRect(); tx = (cx - r.left) / r.width * W; }
  function press() { if (state === 'ready') start(); else if (state === 'over' && Date.now() - overAt > 500) start(); }
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); setX(e.touches[0].clientX); press(); }, false);
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); setX(e.touches[0].clientX); }, false);
  cv.addEventListener('mousedown', function (e) { setX(e.clientX); press(); }, false);
  cv.addEventListener('mousemove', function (e) { if (e.buttons) setX(e.clientX); }, false);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
  document.addEventListener('keydown', function (e) {
    if (e.keyCode === 37) { tx = Math.max(24, bx - 80); e.preventDefault(); }
    if (e.keyCode === 39) { tx = Math.min(W - 24, bx + 80); e.preventDefault(); }
    if (e.keyCode === 32) { e.preventDefault(); press(); }
  }, false);

  reset();
  window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
