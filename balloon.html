<!doctype html>
<html lang="ko" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>풍선 모험</title>
<link rel="stylesheet" href="style.css?v=16">
<style>
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; margin: 6px auto 0; border-radius: 6px; background: #bfe9ff; }
</style>
</head>
<body>
<div class="top"><a href="index.html">‹ 홈</a> 풍선 모험</div>
<div class="wrap" style="padding:0 8px">
  <canvas id="cv" width="360" height="540"></canvas>
  <p style="text-align:center;color:#888;margin:6px 0">손가락을 좌우로 움직여 풍선을 조종하세요</p>
</div>
<script src="sound.js?v=24"></script>
<script>
(function () {
  var W = 360, H = 540;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var state = 'ready', last = 0, overAt = 0;
  var bx, tx, by = 410, objs, dist, nextAt, nextItem, meters, coins, t, vs, best = 0, magnet, slow, shield, deco, flash;
  try { best = parseInt(localStorage.getItem('bestBalloon2') || '0', 10) || 0; } catch (e) {}
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function layout() {
    var h = window.innerHeight - 150, w = window.innerWidth - 16;
    var s = Math.min(w, h * W / H);
    if (s < 240) s = 240;
    cv.style.width = Math.round(s) + 'px'; cv.style.height = Math.round(s * H / W) + 'px';
  }
  window.addEventListener('resize', layout, false);
  window.addEventListener('orientationchange', layout, false);
  layout();

  function reset() {
    bx = W / 2; tx = bx; objs = []; deco = []; dist = 0; nextAt = 120; nextItem = 900; meters = 0; coins = 0; t = 0; vs = 0.22;
    magnet = 0; slow = 0; shield = 0; flash = 0;
    for (var i = 0; i < 5; i++) deco.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(0.7, 1.3) });
  }
  function start() { reset(); state = 'run'; last = 0; }
  function circ(x, y, r, f) { ctx.fillStyle = f; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }

  function spawn() {
    var roll = Math.random(), hard = Math.min(1, meters / 500);
    if (roll < 0.38) {
      var cx = rnd(50, W - 50), n = Math.floor(rnd(3, 7)), wave = rnd(0.8, 1.8);
      for (var i = 0; i < n; i++) objs.push({ k: 'coin', x: Math.max(22, Math.min(W - 22, cx + Math.sin(i * wave) * 45)), y: -20 - i * 34, r: 11 });
    } else if (roll < 0.62) {
      var dir = Math.random() < 0.5 ? 1 : -1;
      objs.push({ k: 'bird', x: dir > 0 ? -20 : W + 20, y: -30, r: 13, dx: dir * rnd(0.08, 0.14 + hard * 0.08) });
    } else if (roll < 0.8 && meters > 120) {
      var d2 = Math.random() < 0.5 ? 1 : -1;
      objs.push({ k: 'plane', x: d2 > 0 ? -30 : W + 30, y: -30, r: 15, dx: d2 * rnd(0.2, 0.3) });
    } else {
      objs.push({ k: 'cloud', x: rnd(45, W - 45), y: -50, r: rnd(28, 40) });
    }
    nextAt = rnd(110, 190) - hard * 40;
  }
  function spawnItem() {
    var kinds = ['magnet', 'slow', 'shield'];
    objs.push({ k: 'item', kind: kinds[Math.floor(Math.random() * 3)], x: rnd(40, W - 40), y: -30, r: 15 });
    nextItem = rnd(700, 1100);
  }

  function update(dt) {
    t += dt;
    var sf = slow > 0 ? 0.5 : 1;
    vs = Math.min(0.5, 0.22 + meters * 0.00035);
    var sv = vs * sf;
    meters += sv * dt * 0.06;
    dist += sv * dt;
    if (dist >= nextAt) { dist = 0; spawn(); }
    nextItem -= sv * dt;
    if (nextItem <= 0) spawnItem();
    bx += (tx - bx) * Math.min(1, 0.02 * dt);
    if (bx < 22) bx = 22; if (bx > W - 22) bx = W - 22;
    if (magnet > 0) magnet -= dt; if (slow > 0) slow -= dt; if (shield > 0) shield -= dt; if (flash > 0) flash -= dt;
    var i, o, cy = by - 8;
    for (i = 0; i < deco.length; i++) { deco[i].y += sv * dt * 0.4; if (deco[i].y > H + 40) { deco[i].y = -40; deco[i].x = rnd(0, W); } }
    for (i = objs.length - 1; i >= 0; i--) {
      o = objs[i];
      o.y += sv * dt; if (o.dx) o.x += o.dx * dt * sf;
      var dx = bx - o.x, dy = cy - o.y, d = Math.sqrt(dx * dx + dy * dy);
      if (o.k === 'coin' && magnet > 0 && d < 150 && d > 1) { o.x += dx / d * 0.45 * dt; o.y += dy / d * 0.45 * dt; }
      if (o.y > H + 60 || o.x < -70 || o.x > W + 70) { objs.splice(i, 1); continue; }
      if (o.k === 'coin') { if (d < o.r + 22) { coins++; objs.splice(i, 1); SFX.play('coin'); } }
      else if (o.k === 'item') {
        if (d < o.r + 22) { if (o.kind === 'magnet') magnet = 6000; else if (o.kind === 'slow') slow = 5000; else shield = 5000; objs.splice(i, 1); flash = 150; SFX.play('item'); }
      } else if (d < o.r + 18) {
        if (shield > 0) { objs.splice(i, 1); flash = 100; SFX.play('drop'); } else { die(); return; }
      }
    }
  }
  function score() { return Math.floor(meters) + coins * 10; }
  function die() {
    state = 'over'; overAt = Date.now(); SFX.play('over');
    if (score() > best) { best = score(); try { localStorage.setItem('bestBalloon2', best); } catch (e) {} }
  }

  function drawItem(o) {
    var col = o.kind === 'magnet' ? '#e5484d' : o.kind === 'slow' ? '#8a63d2' : '#2fb36d';
    circ(o.x, o.y, 15, '#fff'); circ(o.x, o.y, 12, col);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    if (o.kind === 'magnet') { ctx.arc(o.x, o.y - 1, 6, 3.14159, 0); ctx.moveTo(o.x - 6, o.y - 1); ctx.lineTo(o.x - 6, o.y + 5); ctx.moveTo(o.x + 6, o.y - 1); ctx.lineTo(o.x + 6, o.y + 5); }
    else if (o.kind === 'slow') { ctx.arc(o.x, o.y, 6, 0, 6.2832); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x, o.y - 4); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + 3, o.y + 1); }
    else { ctx.moveTo(o.x, o.y - 7); ctx.lineTo(o.x + 6, o.y - 4); ctx.lineTo(o.x + 5, o.y + 3); ctx.lineTo(o.x, o.y + 7); ctx.lineTo(o.x - 5, o.y + 3); ctx.lineTo(o.x - 6, o.y - 4); ctx.closePath(); }
    ctx.stroke();
  }

  function draw() {
    ctx.fillStyle = slow > 0 ? '#d9d1f2' : '#bfe9ff'; ctx.fillRect(0, 0, W, H);
    var i, o;
    for (i = 0; i < deco.length; i++) { var d = deco[i]; circ(d.x, d.y, 14 * d.s, 'rgba(255,255,255,0.7)'); circ(d.x + 14 * d.s, d.y + 4, 10 * d.s, 'rgba(255,255,255,0.7)'); circ(d.x - 14 * d.s, d.y + 4, 10 * d.s, 'rgba(255,255,255,0.7)'); }
    for (i = 0; i < objs.length; i++) {
      o = objs[i];
      if (o.k === 'coin') { circ(o.x, o.y, o.r, '#f0a500'); circ(o.x, o.y, o.r - 3, '#ffd23f'); }
      else if (o.k === 'item') drawItem(o);
      else if (o.k === 'bird') {
        var fl = Math.sin(t / 90) * 8;
        ctx.save(); ctx.translate(o.x, o.y); if (o.dx < 0) ctx.scale(-1, 1);
        circ(0, 0, 8, '#2b2f3a'); circ(8, -3, 4, '#2b2f3a');
        ctx.strokeStyle = '#2b2f3a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-14, -fl); ctx.lineTo(-2, -2); ctx.lineTo(8, -fl * 0.6); ctx.stroke();
        ctx.restore();
      } else if (o.k === 'plane') {
        ctx.save(); ctx.translate(o.x, o.y); if (o.dx < 0) ctx.scale(-1, 1);
        ctx.fillStyle = '#2b2f3a'; ctx.fillRect(-18, -4, 36, 8); ctx.fillRect(-4, -14, 8, 28); ctx.fillRect(-18, -9, 6, 6);
        ctx.restore();
      } else {
        circ(o.x, o.y, o.r, '#5b6270'); circ(o.x - o.r * 0.8, o.y + o.r * 0.2, o.r * 0.7, '#5b6270'); circ(o.x + o.r * 0.8, o.y + o.r * 0.2, o.r * 0.7, '#5b6270');
      }
    }
    // 풍선 (단순한 모양)
    ctx.save(); ctx.translate(bx, by);
    ctx.rotate(Math.max(-0.25, Math.min(0.25, (tx - bx) * 0.004)));
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-8, 6); ctx.lineTo(-7, 24); ctx.moveTo(8, 6); ctx.lineTo(7, 24); ctx.stroke();
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-9, 24, 18, 11);
    circ(0, -16, 22, flash > 0 ? '#fff' : '#e5484d');
    ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.moveTo(-8, 2); ctx.lineTo(8, 2); ctx.lineTo(0, 10); ctx.fill();
    ctx.restore();
    if (shield > 0) { ctx.strokeStyle = 'rgba(47,179,109,' + (shield < 1500 && Math.floor(t / 120) % 2 ? 0.3 : 0.9) + ')'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, by - 8, 38, 0, 6.2832); ctx.stroke(); }
    if (magnet > 0) { ctx.strokeStyle = 'rgba(229,72,77,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx, by - 8, 150, 0, 6.2832); ctx.stroke(); }
    // 표시
    ctx.textAlign = 'left'; ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#25324a';
    ctx.fillText(score(), 12, 28);
    ctx.font = '14px sans-serif'; ctx.fillText('최고 ' + best, 12, 48);
    ctx.textAlign = 'right'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText('코인 ' + coins, W - 12, 26);
    var y = 46, st = [['자석', magnet, '#e5484d'], ['느리게', slow, '#8a63d2'], ['무적', shield, '#2fb36d']];
    ctx.font = '13px sans-serif';
    for (i = 0; i < 3; i++) if (st[i][1] > 0) { ctx.fillStyle = st[i][2]; ctx.fillText(st[i][0] + ' ' + Math.ceil(st[i][1] / 1000), W - 12, y); y += 18; }
    ctx.textAlign = 'center'; ctx.fillStyle = '#25324a';
    if (state === 'ready') { ctx.font = 'bold 28px sans-serif'; ctx.fillText('탭하면 시작!', W / 2, 200); }
    if (state === 'over') {
      ctx.font = 'bold 30px sans-serif'; ctx.fillText('게임 오버', W / 2, 190);
      ctx.font = 'bold 22px sans-serif'; ctx.fillText('점수 ' + score(), W / 2, 228);
      ctx.font = '18px sans-serif'; ctx.fillText('탭해서 다시 시작', W / 2, 262);
    }
  }

  function loop(ts) {
    if (state === 'run') {
      if (!last) last = ts;
      var dt = Math.min(40, ts - last); last = ts;
      update(dt);
    }
    draw();
    window.requestAnimationFrame(loop);
  }

  function setX(cx) { var r = cv.getBoundingClientRect(); tx = (cx - r.left) / r.width * W; }
  function press() { if (state === 'ready') start(); else if (state === 'over' && Date.now() - overAt > 500) start(); }
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); setX(e.touches[0].clientX); press(); }, false);
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); setX(e.touches[0].clientX); }, false);
  cv.addEventListener('mousedown', function (e) { setX(e.clientX); press(); }, false);
  cv.addEventListener('mousemove', function (e) { if (e.buttons) setX(e.clientX); }, false);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
  document.addEventListener('keydown', function (e) {
    if (e.keyCode === 37) { tx = Math.max(22, bx - 90); e.preventDefault(); }
    if (e.keyCode === 39) { tx = Math.min(W - 22, bx + 90); e.preventDefault(); }
    if (e.keyCode === 32) { e.preventDefault(); press(); }
  }, false);

  reset();
  window.requestAnimationFrame(loop);
})();
</script>
<script>SFX.attachBgm();</script>
</body>
</html>
